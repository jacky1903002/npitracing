<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工廠新品追蹤管理系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (Excel 匯入匯出) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Chart.js (圖表分析) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome 圖標 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK (v9 模組化版本 CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        // ==========================================
        // 請在此處填入您的 Firebase 專案設定值
        // ==========================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // 初始化 Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // 預設範例結構與資料
        const defaultColumns = [
            "產品品號", "客戶品號", "圖面繪製完成日", "材料到廠日", 
            "開始加工日", "完成加工日", "品保開始檢驗日", "品保完成檢驗日", "產品入庫日"
        ];

        const defaultRows = [
            { id: "row_1", data: { "產品品號": "PN-A001", "客戶品號": "CUST-001", "圖面繪製完成日": "2026-10-01", "材料到廠日": "2026-10-03", "開始加工日": "2026-10-04", "完成加工日": "2026-10-06", "品保開始檢驗日": "2026-10-07", "品保完成檢驗日": "2026-10-07", "產品入庫日": "2026-10-08" } },
            { id: "row_2", data: { "產品品號": "PN-A002", "客戶品號": "CUST-002", "圖面繪製完成日": "2026-10-02", "材料到廠日": "2026-10-05", "開始加工日": "2026-10-06", "完成加工日": "", "品保開始檢驗日": "", "品保完成檢驗日": "", "產品入庫日": "" } }
        ];

        let columns = [...defaultColumns];
        let tableData = [...defaultRows];
        let analysisChart = null;

        // DOM 元素載入後綁定
        window.addEventListener('DOMContentLoaded', () => {
            const loginSection = document.getElementById('login-section');
            const appSection = document.getElementById('app-section');
            const loginForm = document.getElementById('login-form');
            const logoutBtn = document.getElementById('logout-btn');
            const loginError = document.getElementById('login-error');

            // 監聽登入狀態
            onAuthStateChanged(auth, (user) => {
                if (user) {
                    loginSection.classList.add('hidden');
                    appSection.classList.remove('hidden');
                    document.getElementById('user-email').innerText = user.email;
                    loadDataFromCloud();
                } else {
                    loginSection.classList.remove('hidden');
                    appSection.classList.add('hidden');
                }
            });

            // 登入事件
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                loginError.classList.add('hidden');

                signInWithEmailAndPassword(auth, email, password)
                    .catch((error) => {
                        loginError.innerText = "登入失敗: " + error.message;
                        loginError.classList.remove('hidden');
                    });
            });

            // 登出事件
            logoutBtn.addEventListener('click', () => {
                signOut(auth);
            });

            // 綁定操作按鈕
            document.getElementById('add-row-btn').addEventListener('click', addRow);
            document.getElementById('add-col-btn').addEventListener('click', addColumnPrompt);
            document.getElementById('export-excel-btn').addEventListener('click', exportToExcel);
            document.getElementById('import-excel-input').addEventListener('change', importFromExcel);
            document.getElementById('analyze-btn').addEventListener('click', renderChart);
            document.getElementById('save-cloud-btn').addEventListener('click', saveDataToCloud);
        });

        // 從雲端載入資料
        function loadDataFromCloud() {
            const dbRef = ref(db, 'factory_tracking');
            onValue(dbRef, (snapshot) => {
                const val = snapshot.val();
                if (val) {
                    if (val.columns) columns = val.columns;
                    if (val.rows) tableData = val.rows;
                }
                renderTable();
            }, { onlyOnce: true });
        }

        // 儲存資料到雲端
        function saveDataToCloud() {
            const dbRef = ref(db, 'factory_tracking');
            set(dbRef, {
                columns: columns,
                rows: tableData
            }).then(() => {
                showToast("資料已成功同步至雲端！");
            }).catch((error) => {
                alert("儲存失敗: " + error.message);
            });
        }

        // 渲染表格
        window.renderTable = function() {
            const thead = document.getElementById('table-header');
            const tbody = document.getElementById('table-body');
            
            // 組合表頭
            let headerHtml = `<th class="px-4 py-3 bg-gray-100 text-left text-xs font-medium text-gray-600 uppercase tracking-wider sticky left-0 z-10 w-16">操作</th>`;
            columns.forEach((col, idx) => {
                headerHtml += `
                    <th class="px-4 py-3 bg-gray-100 text-left text-xs font-medium text-gray-600 uppercase tracking-wider min-w-[160px]">
                        <div class="flex items-center justify-between">
                            <span onclick="renameColumn(${idx})" class="cursor-pointer hover:text-blue-600 truncate" title="點擊修改欄位名稱">${col}</span>
                            <button onclick="deleteColumn(${idx})" class="text-red-400 hover:text-red-600 ml-2" title="刪除欄位"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </th>
                `;
            });
            thead.innerHTML = headerHtml;

            // 組合資料列
            let bodyHtml = '';
            tableData.forEach((row, rIdx) => {
                bodyHtml += `<tr class="hover:bg-gray-50 transition-colors">`;
                bodyHtml += `
                    <td class="px-4 py-2 whitespace-nowrap text-center sticky left-0 bg-white z-10 border-b">
                        <button onclick="deleteRow('${row.id}')" class="text-red-500 hover:text-red-700" title="刪除此列"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;
                columns.forEach(col => {
                    const val = row.data[col] || '';
                    // 判斷是否為日期欄位以採用 date input 或 text input
                    const isDate = col.includes('日');
                    const inputType = isDate ? 'date' : 'text';
                    bodyHtml += `
                        <td class="px-4 py-2 whitespace-nowrap border-b">
                            <input type="${inputType}" value="${val}" 
                                class="w-full bg-transparent border-0 focus:ring-1 focus:ring-blue-500 rounded px-1 py-1 text-sm text-gray-700"
                                onchange="updateCellData('${row.id}', '${col}', this.value)">
                        </td>
                    `;
                });
                bodyHtml += `</tr>`;
            });
            tbody.innerHTML = bodyHtml;
        }

        // 更新儲存格資料
        window.updateCellData = function(rowId, colName, value) {
            const row = tableData.find(r => r.id === rowId);
            if (row) {
                row.data[colName] = value;
            }
        }

        // 新增一列
        function addRow() {
            const newId = 'row_' + Date.now();
            const newRowData = {};
            columns.forEach(col => newRowData[col] = '');
            tableData.push({ id: newId, data: newRowData });
            renderTable();
        }

        // 刪除一列
        window.deleteRow = function(rowId) {
            tableData = tableData.filter(r => r.id !== rowId);
            renderTable();
        }

        // 新增欄位
        function addColumnPrompt() {
            const colName = prompt("請輸入新欄位名稱：");
            if (colName && colName.trim() !== "") {
                if (columns.includes(colName.trim())) {
                    alert("欄位名稱已存在！");
                    return;
                }
                columns.push(colName.trim());
                tableData.forEach(row => {
                    row.data[colName.trim()] = '';
                });
                renderTable();
            }
        }

        // 重新命名欄位
        window.renameColumn = function(idx) {
            const oldName = columns[idx];
            const newName = prompt(`請輸入新的欄位名稱 (原名稱: ${oldName})：`, oldName);
            if (newName && newName.trim() !== "" && newName.trim() !== oldName) {
                if (columns.includes(newName.trim())) {
                    alert("欄位名稱已存在！");
                    return;
                }
                columns[idx] = newName.trim();
                tableData.forEach(row => {
                    row.data[newName.trim()] = row.data[oldName] || '';
                    delete row.data[oldName];
                });
                renderTable();
            }
        }

        // 刪除欄位
        window.deleteColumn = function(idx) {
            if (columns.length <= 1) {
                alert("至少需保留一個欄位！");
                return;
            }
            const colName = columns[idx];
            if (confirm(`確定要刪除欄位「${colName}」嗎？對應的資料將會被移除。`)) {
                columns.splice(idx, 1);
                tableData.forEach(row => {
                    delete row.data[colName];
                });
                renderTable();
            }
        }

        // Excel 匯出
        function exportToExcel() {
            const exportData = tableData.map(row => {
                let obj = {};
                columns.forEach(col => {
                    obj[col] = row.data[col] || '';
                });
                return obj;
            });
            const worksheet = XLSX.utils.json_to_sheet(exportData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "新品追蹤表");
            XLSX.writeFile(workbook, "工廠新品追蹤表_" + new Date().toISOString().slice(0,10) + ".xlsx");
        }

        // Excel 匯入
        function importFromExcel(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet);

                    if (json.length > 0) {
                        // 取得所有欄位名稱
                        const importedCols = Object.keys(json[0]);
                        columns = importedCols;
                        tableData = json.map((item, idx) => ({
                            id: 'import_' + idx + '_' + Date.now(),
                            data: item
                        }));
                        renderTable();
                        showToast("Excel 匯入成功！");
                    }
                } catch (err) {
                    alert("匯入失敗，檔案格式可能有誤: " + err.message);
                }
                e.target.value = ''; // 重置 file input
            };
            reader.readAsArrayBuffer(file);
        }

        // 一鍵生成分析圖表 (統計各月份或各狀態的數量)
        function renderChart() {
            const modal = document.getElementById('chart-modal');
            modal.classList.remove('hidden');

            // 統計「產品入庫日」或「開始加工日」的月份分佈，或是品項總數
            const monthCounts = {};
            tableData.forEach(row => {
                // 以開始加工日或入庫日計算月分佈
                const dateVal = row.data['開始加工日'] || row.data['圖面繪製完成日'];
                if (dateVal) {
                    const month = dateVal.slice(0, 7); // YYYY-MM
                    monthCounts[month] = (monthCounts[month] || 0) + 1;
                } else {
                    monthCounts['未排程/未定'] = (monthCounts['未排程/未定'] || 0) + 1;
                }
            });

            const labels = Object.keys(monthCounts).sort();
            const data = labels.map(l => monthCounts[l]);

            const ctx = document.getElementById('analysisChart').getContext('2d');
            if (analysisChart) {
                analysisChart.destroy();
            }

            analysisChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '新品開發數量分佈',
                        data: data,
                        backgroundColor: 'rgba(59, 130, 246, 0.6)',
                        borderColor: 'rgba(59, 130, 246, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'top' },
                        title: { display: true, text: '新品開發進度時間分佈統計圖' }
                    },
                    scales: {
                        y: { beginAtZero: true, ticks: { stepSize: 1 } }
                    }
                }
            });
        }

        window.closeChartModal = function() {
            document.getElementById('chart-modal').classList.add('hidden');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

    <!-- 1. 登入介面 (Firebase Auth) -->
    <div id="login-section" class="flex items-center justify-center min-h-screen px-4">
        <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8">
            <div class="text-center mb-8">
                <div class="bg-blue-600 text-white w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-md">
                    <i class="fa-solid fa-industry"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800">工廠新品追蹤系統</h2>
                <p class="text-sm text-gray-500 mt-1">請使用 Firebase 電子郵件帳號登入</p>
            </div>
            <div id="login-error" class="hidden mb-4 p-3 bg-red-100 text-red-700 text-sm rounded-lg"></div>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">電子郵件</label>
                    <input type="email" id="email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">密碼</label>
                    <input type="password" id="password" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition font-medium shadow-md">
                    登入系統
                </button>
            </form>
        </div>
    </div>

    <!-- 2. 主應用程式介面 (登入後顯示) -->
    <div id="app-section" class="hidden flex flex-col min-h-screen">
        <!-- 頂部導覽列 -->
        <header class="bg-white shadow-sm border-b px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 text-white w-10 h-10 rounded-lg flex items-center justify-center shadow">
                    <i class="fa-solid fa-boxes-stacked"></i>
                </div>
                <h1 class="text-xl font-bold text-gray-800">工廠新品追蹤與進度管理</h1>
            </div>
            <div class="flex items-center space-x-4">
                <span id="user-email" class="text-sm text-gray-600 font-medium bg-gray-100 px-3 py-1.5 rounded-full"></span>
                <button id="logout-btn" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-3.5 py-1.5 rounded-lg text-sm transition font-medium">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i> 登出
                </button>
            </div>
        </header>

        <!-- 主要功能操作區 -->
        <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 flex flex-col">
            <!-- 工具列按鈕群組 -->
            <div class="bg-white p-4 rounded-xl shadow-sm mb-6 flex flex-wrap items-center justify-between gap-4">
                <div class="flex flex-wrap items-center gap-2">
                    <button id="add-row-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow transition flex items-center">
                        <i class="fa-solid fa-plus mr-1.5"></i> 新增資料列
                    </button>
                    <button id="add-col-btn" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow transition flex items-center">
                        <i class="fa-solid fa-columns mr-1.5"></i> 新增欄位
                    </button>
                    <button id="save-cloud-btn" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow transition flex items-center">
                        <i class="fa-solid fa-cloud-arrow-up mr-1.5"></i> 儲存至雲端
                    </button>
                </div>
                <div class="flex flex-wrap items-center gap-2">
                    <button id="analyze-btn" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow transition flex items-center">
                        <i class="fa-solid fa-chart-pie mr-1.5"></i> 一鍵生成圖表
                    </button>
                    <button id="export-excel-btn" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow transition flex items-center">
                        <i class="fa-solid fa-file-excel mr-1.5"></i> 匯出 Excel
                    </button>
                    <label class="bg-cyan-600 hover:bg-cyan-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow transition cursor-pointer flex items-center">
                        <i class="fa-solid fa-file-arrow-up mr-1.5"></i> 匯入 Excel
                        <input type="file" id="import-excel-input" accept=".xlsx, .xls" class="hidden">
                    </label>
                </div>
            </div>

            <!-- 表格容器 -->
            <div class="bg-white rounded-xl shadow-sm flex-1 overflow-hidden border flex flex-col">
                <div class="overflow-x-auto flex-1 max-h-[65vh]">
                    <table class="w-full border-collapse text-left text-sm text-gray-600">
                        <thead>
                            <tr id="table-header"></tr>
                        </thead>
                        <tbody id="table-body" class="divide-y divide-gray-200"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- 圖表分析彈跳視窗 (Modal) -->
    <div id="chart-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-2xl w-full p-6 shadow-2xl relative">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-800"><i class="fa-solid fa-chart-column text-blue-600 mr-2"></i>新品進度分析圖表</h3>
                <button onclick="closeChartModal()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
            </div>
            <div class="relative h-80">
                <canvas id="analysisChart"></canvas>
            </div>
        </div>
    </div>

    <!-- 浮動提示訊息 Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-gray-800 text-white px-4 py-2 rounded-lg shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-50 text-sm"></div>

</body>
</html>
