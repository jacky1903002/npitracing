<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工廠新品追蹤管理系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (Excel 匯入匯出) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Chart.js (圖表分析) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Chart.js DataLabels Plugin -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <!-- FontAwesome 圖標 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK (v9 模組化版本 CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        // ==========================================
        // Firebase 專案設定
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyDt1V52eifMtZU03MacwjTpo94WfKng3To",
            authDomain: "npitracing.firebaseapp.com",
            databaseURL: "https://npitracing-default-rtdb.firebaseio.com",
            projectId: "npitracing",
            storageBucket: "npitracing.firebasestorage.app",
            messagingSenderId: "659482190192",
            appId: "1:659482190192:web:4a1da1941a2124a6a56fb5",
            measurementId: "G-ZGGL2574BB"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const defaultColumns = [
            "產品品號", "客戶品號", "製令編號", "PO下單日", "圖面繪製完成日", 
            "BOM完成日", "多部門會簽完成日", "材料到廠日", "製造開始加工日", 
            "製造完成加工日", "其他(待料)完成日", "委外完成日", "品保開始檢驗日", 
            "品保完成檢驗日", "異常返修完工日", "異常返修檢驗完成日", "產品入庫日", 
            "目標完成日", "備註", "是否有重工"
        ];

        const defaultRows = [
            { 
                id: "row_1", 
                data: { 
                    "產品品號": "PN-A001", "客戶品號": "CUST-001", "製令編號": "MO-2026-001", "PO下單日": "2026-09-25", "圖面繪製完成日": "2026-10-01", 
                    "BOM完成日": "2026-10-02", "多部門會簽完成日": "2026-10-02", "材料到廠日": "2026-10-03", "製造開始加工日": "2026-10-04", 
                    "製造完成加工日": "2026-10-06", "其他(待料)完成日": "", "委外完成日": "", "品保開始檢驗日": "2026-10-07", "品保完成檢驗日": "2026-10-07", 
                    "異常返修完工日": "", "異常返修檢驗完成日": "", "產品入庫日": "2026-10-08", "目標完成日": "2026-10-10", "備註": "首件試產順利", "是否有重工": "無" 
                } 
            },
            { 
                id: "row_2", 
                data: { 
                    "產品品號": "PN-A002", "客戶品號": "CUST-002", "製令編號": "MO-2026-002", "PO下單日": "2026-09-20", "圖面繪製完成日": "2026-09-25", 
                    "BOM完成日": "2026-09-26", "多部門會簽完成日": "2026-09-27", "材料到廠日": "2026-09-28", "製造開始加工日": "2026-09-30", 
                    "製造完成加工日": "2026-10-05", "其他(待料)完成日": "", "委外完成日": "", "品保開始檢驗日": "2026-10-06", "品保完成檢驗日": "2026-10-07", 
                    "異常返修完工日": "2026-10-08", "異常返修檢驗完成日": "2026-10-09", "產品入庫日": "2026-10-10", "目標完成日": "2026-10-01", "備註": "尺寸異常重工", "是否有重工": "有" 
                } 
            }
        ];

        let columns = [...defaultColumns];
        let tableData = [...defaultRows];
        let activeCharts = {};
        let currentChartTab = 1;
        let isInitialLoading = true;
        let draggedColIdx = null;
        let draggedRowId = null;

        window.addEventListener('DOMContentLoaded', () => {
            const loginSection = document.getElementById('login-section');
            const appSection = document.getElementById('app-section');
            const loginForm = document.getElementById('login-form');
            const logoutBtn = document.getElementById('logout-btn');
            const loginError = document.getElementById('login-error');

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    loginSection.classList.add('hidden');
                    appSection.classList.remove('hidden');
                    document.getElementById('user-email').innerText = user.email;
                    loadDataFromCloud();
                } else {
                    loginSection.classList.remove('hidden');
                    appSection.classList.add('hidden');
                }
            });

            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                loginError.classList.add('hidden');

                signInWithEmailAndPassword(auth, email, password)
                    .catch((error) => {
                        loginError.innerText = "登入失敗: " + error.message;
                        loginError.classList.remove('hidden');
                    });
            });

            logoutBtn.addEventListener('click', () => { signOut(auth); });

            document.getElementById('add-row-btn').addEventListener('click', addRow);
            document.getElementById('copy-row-btn').addEventListener('click', copyPreviousRow);
            document.getElementById('add-col-btn').addEventListener('click', addColumnPrompt);
            document.getElementById('export-excel-btn').addEventListener('click', exportToExcel);
            document.getElementById('import-excel-input').addEventListener('change', importFromExcel);
            document.getElementById('analyze-btn').addEventListener('click', openChartModal);
            document.getElementById('export-charts-btn').addEventListener('click', exportAllChartsPNG);
            document.getElementById('export-combined-btn').addEventListener('click', exportCombined6in1PNG);
            document.getElementById('export-abnormal-btn').addEventListener('click', exportAbnormalChartPNG);

            const connectedRef = ref(db, '.info/connected');
            onValue(connectedRef, (snap) => {
                const indicator = document.getElementById('conn-indicator');
                const text = document.getElementById('conn-text');
                if (snap.val() === true) {
                    indicator.className = "w-3 h-3 rounded-full bg-emerald-500 animate-pulse";
                    text.innerText = "雲端已連線";
                    text.className = "text-xs font-medium text-emerald-600";
                } else {
                    indicator.className = "w-3 h-3 rounded-full bg-red-500";
                    text.innerText = "雲端斷線中";
                    text.className = "text-xs font-medium text-red-600";
                }
            });
        });

        function loadDataFromCloud() {
            const dbRef = ref(db, 'factory_tracking');
            onValue(dbRef, (snapshot) => {
                const val = snapshot.val();
                if (val) {
                    if (val.columns) columns = val.columns;
                    if (val.rows) tableData = val.rows;
                    if (val.lastUpdated) {
                        document.getElementById('last-update-time').innerText = val.lastUpdated;
                    }
                }
                isInitialLoading = false;
                renderTable();
            });
        }

        window.autoSaveToCloud = function() {
            if (isInitialLoading) return;
            const nowStr = new Date().toLocaleString('zh-TW', { hour12: false });
            const dbRef = ref(db, 'factory_tracking');
            set(dbRef, {
                columns: columns,
                rows: tableData,
                lastUpdated: nowStr
            }).then(() => {
                document.getElementById('last-update-time').innerText = nowStr;
                showToast("已自動同步至雲端");
            }).catch((error) => {
                console.error("自動儲存失敗: ", error);
            });
        }

        // ================= 渲染表格與燈號計算 =================
        window.renderTable = function() {
            const thead = document.getElementById('table-header');
            const tbody = document.getElementById('table-body');
            
            let headerHtml = `<th class="px-4 py-3 bg-gray-100 text-center text-xs font-medium text-gray-600 uppercase tracking-wider sticky left-0 z-25 w-24">燈號</th>`;
            headerHtml += `<th class="px-4 py-3 bg-gray-100 text-center text-xs font-medium text-gray-600 uppercase tracking-wider sticky left-24 z-20 w-20">操作</th>`;
            
            columns.forEach((col, idx) => {
                headerHtml += `
                    <th class="px-4 py-3 bg-gray-100 text-left text-xs font-medium text-gray-600 uppercase tracking-wider min-w-[160px] cursor-grab active:cursor-grabbing select-none"
                        draggable="true"
                        ondragstart="onColumnDragStart(event, ${idx})"
                        ondragover="event.preventDefault()"
                        ondrop="onColumnDrop(event, ${idx})">
                        <div class="flex items-center justify-between">
                            <span onclick="renameColumn(${idx})" class="cursor-pointer hover:text-blue-600 truncate" title="點擊修改欄位名稱"><i class="fa-solid fa-grip-vertical mr-1 text-gray-400"></i>${col}</span>
                            <button onclick="deleteColumn(${idx})" class="text-red-400 hover:text-red-600 ml-2" title="刪除欄位"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </th>
                `;
            });
            thead.innerHTML = headerHtml;

            let bodyHtml = '';
            tableData.forEach((row) => {
                let lightHtml = `<span class="px-2.5 py-1 text-xs font-bold rounded-full bg-gray-200 text-gray-700">未定</span>`;
                const targetDateStr = row.data["目標完成日"];
                const actualDateStr = row.data["產品入庫日"];

                if (targetDateStr) {
                    const targetTime = new Date(targetDateStr).getTime();
                    const checkTime = actualDateStr ? new Date(actualDateStr).getTime() : new Date().getTime();
                    const diffDays = (checkTime - targetTime) / (1000 * 3600 * 24);

                    if (diffDays <= 0) {
                        lightHtml = `<span class="inline-flex items-center px-2.5 py-1 text-xs font-bold rounded-full bg-emerald-100 text-emerald-800" title="進度超前或準時"><span class="w-2 h-2 mr-1.5 bg-emerald-500 rounded-full animate-pulse"></span>🟢 綠燈</span>`;
                    } else if (diffDays <= 15) {
                        lightHtml = `<span class="inline-flex items-center px-2.5 py-1 text-xs font-bold rounded-full bg-amber-100 text-amber-800" title="落後 1~15 天"><span class="w-2 h-2 mr-1.5 bg-amber-500 rounded-full"></span>🟡 黃燈</span>`;
                    } else {
                        lightHtml = `<span class="inline-flex items-center px-2.5 py-1 text-xs font-bold rounded-full bg-red-100 text-red-800" title="落後超過 15 天"><span class="w-2 h-2 mr-1.5 bg-red-500 rounded-full"></span>🔴 紅燈</span>`;
                    }
                }

                bodyHtml += `
                    <tr class="hover:bg-gray-50 transition-colors"
                        draggable="true"
                        ondragstart="onRowDragStart(event, '${row.id}')"
                        ondragover="event.preventDefault()"
                        ondrop="onRowDrop(event, '${row.id}')">
                `;
                bodyHtml += `<td class="px-2 py-2 whitespace-nowrap text-center sticky left-0 bg-white z-25 border-b">${lightHtml}</td>`;
                bodyHtml += `
                    <td class="px-2 py-2 whitespace-nowrap text-center sticky left-24 bg-white z-20 border-b">
                        <div class="flex items-center justify-center space-x-1.5">
                            <span class="cursor-grab text-gray-400 hover:text-gray-600 px-1" title="按住拖曳調整列順序"><i class="fa-solid fa-bars"></i></span>
                            <button onclick="deleteRow('${row.id}')" class="text-red-500 hover:text-red-700" title="刪除此列"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </td>
                `;
                columns.forEach(col => {
                    const val = row.data[col] || '';
                    const isDate = col.includes('日');
                    const inputType = isDate ? 'date' : 'text';
                    bodyHtml += `
                        <td class="px-4 py-2 whitespace-nowrap border-b">
                            <input type="${inputType}" value="${val}" 
                                class="w-full bg-transparent border-0 focus:ring-1 focus:ring-blue-500 rounded px-1 py-1 text-sm text-gray-700"
                                onchange="updateCellData('${row.id}', '${col}', this.value)">
                        </td>
                    `;
                });
                bodyHtml += `</tr>`;
            });
            tbody.innerHTML = bodyHtml;
        }

        window.onColumnDragStart = function(e, idx) { draggedColIdx = idx; }
        window.onColumnDrop = function(e, targetIdx) {
            e.preventDefault();
            if (draggedColIdx === null || draggedColIdx === targetIdx) return;
            const movedCol = columns.splice(draggedColIdx, 1)[0];
            columns.splice(targetIdx, 0, movedCol);
            draggedColIdx = null;
            renderTable();
            autoSaveToCloud();
        }

        window.onRowDragStart = function(e, rowId) { draggedRowId = rowId; }
        window.onRowDrop = function(e, targetRowId) {
            e.preventDefault();
            if (!draggedRowId || draggedRowId === targetRowId) return;
            const fromIdx = tableData.findIndex(r => r.id === draggedRowId);
            const toIdx = tableData.findIndex(r => r.id === targetRowId);
            if (fromIdx !== -1 && toIdx !== -1) {
                const movedRow = tableData.splice(fromIdx, 1)[0];
                tableData.splice(toIdx, 0, movedRow);
                draggedRowId = null;
                renderTable();
                autoSaveToCloud();
            }
        }

        window.updateCellData = function(rowId, colName, value) {
            const row = tableData.find(r => r.id === rowId);
            if (row) {
                row.data[colName] = value;
                renderTable();
                autoSaveToCloud();
            }
        }

        function addRow() {
            const newId = 'row_' + Date.now();
            const newRowData = {};
            columns.forEach(col => newRowData[col] = '');
            tableData.push({ id: newId, data: newRowData });
            renderTable();
            autoSaveToCloud();
        }

        function copyPreviousRow() {
            if (tableData.length === 0) {
                addRow();
                return;
            }
            const lastRow = tableData[tableData.length - 1];
            const newId = 'row_' + Date.now();
            const copiedData = { ...lastRow.data };
            tableData.push({ id: newId, data: copiedData });
            renderTable();
            autoSaveToCloud();
            showToast("已成功複製上一筆資料列！");
        }

        window.deleteRow = function(rowId) {
            tableData = tableData.filter(r => r.id !== rowId);
            renderTable();
            autoSaveToCloud();
        }

        function addColumnPrompt() {
            const colName = prompt("請輸入新欄位名稱：");
            if (colName && colName.trim() !== "") {
                if (columns.includes(colName.trim())) {
                    alert("欄位名稱已存在！");
                    return;
                }
                columns.push(colName.trim());
                tableData.forEach(row => { row.data[colName.trim()] = ''; });
                renderTable();
                autoSaveToCloud();
            }
        }

        window.renameColumn = function(idx) {
            const oldName = columns[idx];
            const newName = prompt(`請輸入新的欄位名稱 (原名稱: ${oldName})：`, oldName);
            if (newName && newName.trim() !== "" && newName.trim() !== oldName) {
                if (columns.includes(newName.trim())) {
                    alert("欄位名稱已存在！");
                    return;
                }
                columns[idx] = newName.trim();
                tableData.forEach(row => {
                    row.data[newName.trim()] = row.data[oldName] || '';
                    delete row.data[oldName];
                });
                renderTable();
                autoSaveToCloud();
            }
        }

        window.deleteColumn = function(idx) {
            if (columns.length <= 1) {
                alert("至少需保留一個欄位！");
                return;
            }
            const colName = columns[idx];
            if (confirm(`確定要刪除欄位「${colName}」嗎？`)) {
                columns.splice(idx, 1);
                tableData.forEach(row => { delete row.data[colName]; });
                renderTable();
                autoSaveToCloud();
            }
        }

        // ================= Excel 匯入匯出 =================
        function exportToExcel() {
            const exportData = tableData.map(row => {
                let obj = {};
                columns.forEach(col => { obj[col] = row.data[col] || ''; });
                return obj;
            });
            const worksheet = XLSX.utils.json_to_sheet(exportData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "新品追蹤表");
            XLSX.writeFile(workbook, "工廠新品追蹤表_" + new Date().toISOString().slice(0,10) + ".xlsx");
        }

        function importFromExcel(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet);

                    if (json.length > 0) {
                        columns = Object.keys(json[0]);
                        tableData = json.map((item, idx) => ({ id: 'import_' + idx + '_' + Date.now(), data: item }));
                        renderTable();
                        autoSaveToCloud();
                        showToast("Excel 匯入成功並已自動存入雲端！");
                    }
                } catch (err) {
                    alert("匯入失敗: " + err.message);
                }
                e.target.value = '';
            };
            reader.readAsArrayBuffer(file);
        }

        // ================= 綜合圖表分析系統 =================
        window.openChartModal = function() {
            const modal = document.getElementById('chart-modal');
            modal.classList.remove('hidden');
            switchChartTab(1);
        }

        window.closeChartModal = function() {
            document.getElementById('chart-modal').classList.add('hidden');
        }

        window.switchChartTab = function(tabNum) {
            currentChartTab = tabNum;
            for (let i = 1; i <= 7; i++) {
                const btn = document.getElementById(`tab-btn-${i}`);
                const view = document.getElementById(`chart-view-${i}`);
                if (i === tabNum) {
                    btn.className = "px-3 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-bold shadow whitespace-nowrap";
                    view.classList.remove('hidden');
                } else {
                    btn.className = "px-3 py-1.5 bg-gray-700 text-gray-300 hover:bg-gray-600 rounded-lg text-xs font-medium transition whitespace-nowrap";
                    view.classList.add('hidden');
                }
            }
            renderSpecificChart(tabNum);
        }

        function renderSpecificChart(tabNum) {
            const canvasId = `chartCanvas_${tabNum}`;
            const ctx = document.getElementById(canvasId).getContext('2d');
            if (activeCharts[tabNum]) {
                activeCharts[tabNum].destroy();
            }

            const lastRow = tableData[tableData.length - 1];
            const lastCustPN = lastRow ? (lastRow.data["客戶品號"] || "最新項目") : "";

            if (tabNum === 1) {
                const dateCounts = {};
                tableData.forEach(row => {
                    const d = row.data['產品入庫日'] || row.data['製造完成加工日'];
                    if (d) {
                        const dateKey = d.slice(0, 10);
                        dateCounts[dateKey] = (dateCounts[dateKey] || 0) + 1;
                    }
                });
                const sortedDates = Object.keys(dateCounts).sort();
                let cumulative = 0;
                const cumData = sortedDates.map(date => {
                    cumulative += dateCounts[date];
                    return cumulative;
                });

                activeCharts[1] = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: sortedDates.length > 0 ? sortedDates : ['無完成資料'],
                        datasets: [{
                            label: '累積完成首件件數',
                            data: sortedDates.length > 0 ? cumData : [0],
                            borderColor: 'rgba(37, 99, 235, 1)',
                            backgroundColor: 'rgba(37, 99, 235, 0.1)',
                            fill: true,
                            tension: 0.2,
                            borderWidth: 3
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: { display: true, text: '新品開發累積完成首件件數趨勢圖', font: { size: 16 } },
                            datalabels: {
                                align: 'top',
                                anchor: 'end',
                                formatter: function(value, context) {
                                    if (context.dataIndex === context.dataset.data.length - 1) {
                                        return `${lastCustPN} (${value})`;
                                    }
                                    return '';
                                },
                                backgroundColor: null,
                                borderColor: null,
                                borderWidth: 0,
                                color: '#1e3a8a',
                                font: { weight: 'bold', size: 12 },
                                padding: 4
                            }
                        },
                        scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
                    },
                    plugins: [ChartDataLabels]
                });

            } else if (tabNum === 2) {
                // 圖表 2：各站完成日分析 (點跟點之間顯示相減天數，最後一個點顯示客戶品號標籤)
                const stations = [
                    "PO下單日", "圖面繪製完成日", "BOM完成日", "多部門會簽完成日", "材料到廠日", 
                    "製造開始加工日", "製造完成加工日", "品保完成檢驗日", "產品入庫日"
                ];
                
                const avgDaysPerStation = stations.map((st, sIdx) => {
                    if (sIdx === 0) return 0.0;
                    let totalDays = 0;
                    let count = 0;
                    tableData.forEach(row => {
                        const po = row.data["PO下單日"];
                        const stDate = row.data[st];
                        if (po && stDate) {
                            const diff = (new Date(stDate).getTime() - new Date(po).getTime()) / (1000 * 3600 * 24);
                            if (diff >= 0) {
                                totalDays += diff;
                                count++;
                            }
                        }
                    });
                    return count > 0 ? parseFloat((totalDays / count).toFixed(1)) : 0.0;
                });

                activeCharts[2] = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: stations.map(s => s.replace('完成日', '').replace('日', '')),
                        datasets: [{
                            label: '平均累積天數 (自 PO 下單起算)',
                            data: avgDaysPerStation,
                            borderColor: 'rgba(16, 185, 129, 1)',
                            backgroundColor: 'rgba(16, 185, 129, 0.1)',
                            fill: true,
                            tension: 0.2,
                            borderWidth: 3,
                            pointRadius: 6
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: { display: true, text: '各站點平均累積天數與區段間隔天數分析圖 (單位: 天)', font: { size: 16 } },
                            datalabels: {
                                align: function(context) {
                                    return context.dataIndex % 2 === 0 ? 'top' : 'bottom';
                                },
                                anchor: 'center',
                                formatter: function(value, context) {
                                    const idx = context.dataIndex;
                                    const currentVal = value;
                                    const totalLen = context.dataset.data.length;

                                    if (idx === 0) {
                                        return `${currentVal.toFixed(1)}d`;
                                    } else {
                                        const prevVal = context.dataset.data[idx - 1];
                                        const diffInterval = parseFloat((currentVal - prevVal).toFixed(1));
                                        let labelStr = `累:${currentVal.toFixed(1)}d\n(區段:+${diffInterval}d)`;
                                        // 若為最後一個點，附帶顯示客戶品號
                                        if (idx === totalLen - 1) {
                                            labelStr = `${lastCustPN}\n` + labelStr;
                                        }
                                        return labelStr;
                                    }
                                },
                                backgroundColor: null,
                                borderColor: null,
                                borderWidth: 0,
                                color: '#065f46',
                                font: { weight: 'bold', size: 11 },
                                padding: 4
                            }
                        },
                        scales: { y: { beginAtZero: true, title: { display: true, text: '累積天數 (Days)' } } }
                    },
                    plugins: [ChartDataLabels]
                });

            } else if (tabNum === 3) {
                const durationKeys = ["PO下單至圖面完成", "圖面完成至材料到廠", "材料到廠至開始加工", "製造加工耗時", "品保檢驗耗時", "總前置時間(PO到入庫)"];
                const durations = { "PO下單至圖面完成": [], "圖面完成至材料到廠": [], "材料到廠至開始加工": [], "製造加工耗時": [], "品保檢驗耗時": [], "總前置時間(PO到入庫)": [] };

                tableData.forEach(row => {
                    const d_po = row.data["PO下單日"];
                    const d_draw = row.data["圖面繪製完成日"];
                    const d_mat = row.data["材料到廠日"];
                    const d_start = row.data["製造開始加工日"];
                    const d_end = row.data["製造完成加工日"];
                    const d_qc = row.data["品保完成檢驗日"];
                    const d_in = row.data["產品入庫日"];

                    const diffDays = (s1, s2) => {
                        if (!s1 || !s2) return null;
                        const diff = (new Date(s2).getTime() - new Date(s1).getTime()) / (1000 * 3600 * 24);
                        return diff >= 0 ? diff : null;
                    };

                    if (diffDays(d_po, d_draw) !== null) durations["PO下單至圖面完成"].push(diffDays(d_po, d_draw));
                    if (diffDays(d_draw, d_mat) !== null) durations["圖面完成至材料到廠"].push(diffDays(d_draw, d_mat));
                    if (diffDays(d_mat, d_start) !== null) durations["材料到廠至開始加工"].push(diffDays(d_mat, d_start));
                    if (diffDays(d_start, d_end) !== null) durations["製造加工耗時"].push(diffDays(d_start, d_end));
                    if (diffDays(d_end, d_qc) !== null) durations["品保檢驗耗時"].push(diffDays(d_end, d_qc));
                    if (diffDays(d_po, d_in) !== null) durations["總前置時間(PO到入庫)"].push(diffDays(d_po, d_in));
                });

                const avg = arr => arr.length ? parseFloat((arr.reduce((a, b) => a + b, 0) / arr.length).toFixed(1)) : 0.0;
                const avgData = durationKeys.map(k => avg(durations[k]));

                activeCharts[3] = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: durationKeys,
                        datasets: [{
                            label: '平均耗時 (天)',
                            data: avgData,
                            borderColor: 'rgba(217, 119, 6, 1)',
                            backgroundColor: 'rgba(217, 119, 6, 0.1)',
                            fill: true,
                            tension: 0.2,
                            borderWidth: 3,
                            pointRadius: 5
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: { display: true, text: '各站點平均流轉與加工天數瓶頸折線分析 (單位: 天)', font: { size: 16 } },
                            datalabels: {
                                align: 'top',
                                anchor: 'end',
                                formatter: function(value, context) {
                                    if (context.dataIndex === context.dataset.data.length - 1) {
                                        return `${lastCustPN} (${value.toFixed(1)}天)`;
                                    }
                                    return `${value.toFixed(1)}d`;
                                },
                                backgroundColor: null,
                                borderColor: null,
                                borderWidth: 0,
                                color: '#b45309',
                                font: { weight: 'bold', size: 12 },
                                padding: 4
                            }
                        },
                        scales: { y: { beginAtZero: true, title: { display: true, text: '天數 (Days)' } } }
                    },
                    plugins: [ChartDataLabels]
                });

            } else if (tabNum === 4) {
                let totalCount = tableData.length;
                let reworkCount = tableData.filter(row => row.data["是否有重工"] && (row.data["是否有重工"].includes("有") || row.data["是否有重工"].toLowerCase() === "yes")).length;
                let passFirstTime = totalCount - reworkCount;
                let passRate = totalCount > 0 ? ((passFirstTime / totalCount) * 100).toFixed(1) : 0.0;

                activeCharts[4] = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['一次通過件數', '重工件數'],
                        datasets: [{
                            data: [passFirstTime, reworkCount],
                            backgroundColor: ['#10b981', '#ef4444'],
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: { display: true, text: `新品開發一次通過率: ${passRate}% (總數: ${totalCount} 件)`, font: { size: 16 } },
                            legend: { position: 'bottom' }
                        }
                    }
                });

            } else if (tabNum === 5) {
                const scatterData = [];
                const productLabels = [];

                tableData.forEach((row, idx) => {
                    const custPn = row.data["客戶品號"] || `項次 ${idx+1}`;
                    productLabels.push(custPn);
                    const target = row.data["目標完成日"];
                    const actual = row.data["產品入庫日"] || new Date().toISOString().slice(0, 10);
                    if (target) {
                        const diff = parseFloat(((new Date(actual).getTime() - new Date(new Date(target).toDateString()).getTime()) / (1000 * 3600 * 24)).toFixed(1));
                        scatterData.push({ x: idx + 1, y: diff, custName: custPn });
                    }
                });

                activeCharts[5] = new Chart(ctx, {
                    type: 'scatter',
                    data: {
                        datasets: [{
                            label: '客戶品號與目標日 GAP (天)',
                            data: scatterData,
                            backgroundColor: scatterData.map(d => d.y <= 0 ? '#10b981' : '#ef4444'),
                            pointRadius: 8,
                            pointHoverRadius: 10
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: { display: true, text: '目標日 GAP 散布分析圖 (客戶品號 vs GAP 天數)', font: { size: 16 } },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        const point = context.raw;
                                        return `${point.custName}: GAP ${point.y} 天`;
                                    }
                                }
                            },
                            datalabels: {
                                align: 'top',
                                anchor: 'end',
                                formatter: function(value, context) {
                                    if (context.dataIndex === context.dataset.data.length - 1) {
                                        return `${value.custName} (${value.y > 0 ? '+' + value.y : value.y}天)`;
                                    }
                                    return `${value.custName}`;
                                },
                                backgroundColor: null,
                                borderColor: null,
                                borderWidth: 0,
                                color: '#1d4ed8',
                                font: { weight: 'bold', size: 12 },
                                padding: 4
                            }
                        },
                        scales: {
                            x: {
                                title: { display: true, text: '客戶品號' },
                                ticks: {
                                    callback: function(val) {
                                        return productLabels[val - 1] || '';
                                    },
                                    stepSize: 1
                                }
                            },
                            y: {
                                title: { display: true, text: 'GAP 天數 (實際 - 目標)' }
                            }
                        }
                    },
                    plugins: [ChartDataLabels]
                });

            } else if (tabNum === 6) {
                const scatterData = [];
                const productLabels = [];

                tableData.forEach((row, idx) => {
                    const custPn = row.data["客戶品號"] || `項次 ${idx+1}`;
                    productLabels.push(custPn);
                    const po = row.data["PO下單日"];
                    const inDate = row.data["產品入庫日"];
                    if (po && inDate) {
                        const days = parseFloat(((new Date(inDate).getTime() - new Date(po).getTime()) / (1000 * 3600 * 24)).toFixed(1));
                        if (days >= 0) {
                            scatterData.push({ x: idx + 1, y: days, custName: custPn });
                        }
                    }
                });

                const currentMonthStr = new Date().toISOString().slice(0, 7);
                const monthInCount = tableData.filter(row => row.data["產品入庫日"] && row.data["產品入庫日"].startsWith(currentMonthStr)).length;

                activeCharts[6] = new Chart(ctx, {
                    type: 'scatter',
                    data: {
                        datasets: [{
                            label: 'PO 到入庫總天數',
                            data: scatterData,
                            backgroundColor: '#3b82f6',
                            pointRadius: 8,
                            pointHoverRadius: 10
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { 
                            title: { display: true, text: `全產品一覽：PO 到入庫總天數散布圖 (本月累計入庫總數: ${monthInCount} 件，單位: 天)`, font: { size: 16 } },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        const point = context.raw;
                                        return `${point.custName}: 總天數 ${point.y} 天`;
                                    }
                                }
                            },
                            datalabels: {
                                align: 'top',
                                anchor: 'end',
                                formatter: function(value, context) {
                                    if (context.dataIndex === context.dataset.data.length - 1) {
                                        return `${value.custName} (${value.y}天)`;
                                    }
                                    return `${value.custName}`;
                                },
                                backgroundColor: null,
                                borderColor: null,
                                borderWidth: 0,
                                color: '#2563eb',
                                font: { weight: 'bold', size: 12 },
                                padding: 4
                            }
                        },
                        scales: { 
                            x: {
                                title: { display: true, text: '客戶品號' },
                                ticks: {
                                    callback: function(val) {
                                        return productLabels[val - 1] || '';
                                    },
                                    stepSize: 1
                                }
                            },
                            y: { 
                                beginAtZero: true, 
                                title: { display: true, text: '總天數 (Days)' } 
                            } 
                        }
                    },
                    plugins: [ChartDataLabels]
                });

            } else if (tabNum === 7) {
                const remarkMap = {};
                tableData.forEach(row => {
                    const remark = (row.data["備註"] || "").trim();
                    if (remark !== "") {
                        const target = row.data["目標完成日"];
                        const actual = row.data["產品入庫日"] || new Date().toISOString().slice(0, 10);
                        let delayDays = 0.0;
                        if (target) {
                            const diff = (new Date(actual).getTime() - new Date(new Date(target).toDateString()).getTime()) / (1000 * 3600 * 24);
                            if (diff > 0) delayDays = parseFloat(diff.toFixed(1));
                        }
                        if (!remarkMap[remark]) {
                            remarkMap[remark] = { totalDelay: 0, count: 0, custName: row.data["客戶品號"] || "項目" };
                        }
                        remarkMap[remark].totalDelay += delayDays;
                        remarkMap[remark].count += 1;
                        remarkMap[remark].custName = row.data["客戶品號"] || remarkMap[remark].custName;
                    }
                });

                const remarks = Object.keys(remarkMap);
                const avgDelays = remarks.map(r => parseFloat((remarkMap[r].totalDelay / remarkMap[r].count).toFixed(1)));

                activeCharts[7] = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: remarks.length > 0 ? remarks : ['無備註異常記錄'],
                        datasets: [{
                            label: '平均異常/延遲天數 (天)',
                            data: remarks.length > 0 ? avgDelays : [0],
                            backgroundColor: 'rgba(239, 68, 68, 0.7)',
                            borderColor: 'rgba(239, 68, 68, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: { display: true, text: '備註事件與對應異常延遲天數分析報表', font: { size: 16 } },
                            datalabels: {
                                align: 'top',
                                anchor: 'end',
                                formatter: function(value, context) {
                                    if (remarks.length > 0) {
                                        const cust = remarkMap[remarks[context.dataIndex]].custName;
                                        return `${cust} (${value}天)`;
                                    }
                                    return '';
                                },
                                backgroundColor: null,
                                borderColor: null,
                                borderWidth: 0,
                                color: '#b91c1c',
                                font: { weight: 'bold', size: 12 },
                                padding: 4
                            }
                        },
                        scales: { y: { beginAtZero: true, title: { display: true, text: '平均延遲天數 (Days)' } } }
                    },
                    plugins: [ChartDataLabels]
                });
            }
        }

        // 一鍵匯出所有圖表獨立 PNG
        window.exportAllChartsPNG = function() {
            for (let i = 1; i <= 7; i++) {
                const canvas = document.getElementById(`chartCanvas_${i}`);
                if (canvas) {
                    if (!activeCharts[i]) {
                        switchChartTab(i);
                    }
                    const imageURL = canvas.toDataURL('image/png');
                    const link = document.createElement('a');
                    link.href = imageURL;
                    link.download = `新品分析圖表_分頁${i}_${new Date().toISOString().slice(0,10)}.png`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }
            }
            switchChartTab(currentChartTab);
            showToast("已成功匯出所有獨立圖表 PNG！");
        }

        // 獨立匯出第 7 個異常分析報表
        window.exportAbnormalChartPNG = function() {
            const canvas = document.getElementById(`chartCanvas_7`);
            if (canvas) {
                if (!activeCharts[7]) {
                    switchChartTab(7);
                }
                const imageURL = canvas.toDataURL('image/png');
                const link = document.createElement('a');
                link.href = imageURL;
                link.download = `異常分析報表_${new Date().toISOString().slice(0,10)}.png`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast("已成功匯出異常分析報表 PNG！");
            }
            switchChartTab(currentChartTab);
        }

        // 一鍵匯出 6 合一圖表 (3X2 橫軸3排, 縱軸2排，最大化全螢幕高解析)
        window.exportCombined6in1PNG = async function() {
            const originalTab = currentChartTab;
            const tempCanvases = [];

            for (let i = 1; i <= 6; i++) {
                switchChartTab(i);
                await new Promise(resolve => setTimeout(resolve, 150));
                const canvas = document.getElementById(`chartCanvas_${i}`);
                if (canvas) {
                    tempCanvases.push(canvas);
                }
            }
            switchChartTab(originalTab);

            const combinedCanvas = document.createElement('canvas');
            const targetWidth = 3600;
            const targetHeight = 2400;
            combinedCanvas.width = targetWidth;
            combinedCanvas.height = targetHeight;
            const ctx = combinedCanvas.getContext('2d');

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, targetWidth, targetHeight);

            ctx.fillStyle = '#111827';
            ctx.font = 'bold 52px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('工廠新品開發綜合圖表分析報表 (6合一全螢幕總結)', targetWidth / 2, 80);

            const cols = 3;
            const rows = 2;
            const marginX = 100;
            const marginY = 140;
            const spacingX = 80;
            const spacingY = 80;

            const panelWidth = (targetWidth - (marginX * 2) - (spacingX * (cols - 1))) / cols;
            const panelHeight = (targetHeight - marginY - 100 - (spacingY * (rows - 1))) / rows;

            let loadedImages = 0;

            tempCanvases.forEach((srcCanvas, idx) => {
                const img = new Image();
                img.src = srcCanvas.toDataURL('image/png');
                img.onload = () => {
                    const c = idx % cols;
                    const r = Math.floor(idx / cols);
                    const x = marginX + c * (panelWidth + spacingX);
                    const y = marginY + 40 + r * (panelHeight + spacingY);

                    ctx.strokeStyle = '#e5e7eb';
                    ctx.lineWidth = 4;
                    ctx.fillStyle = '#f9fafb';
                    ctx.beginPath();
                    ctx.roundRect(x, y, panelWidth, panelHeight, 16);
                    ctx.fill();
                    ctx.stroke();

                    ctx.drawImage(img, x + 20, y + 20, panelWidth - 40, panelHeight - 40);

                    loadedImages++;
                    if (loadedImages === tempCanvases.length) {
                        const combinedURL = combinedCanvas.toDataURL('image/png');
                        const link = document.createElement('a');
                        link.href = combinedURL;
                        link.download = `工廠新品追蹤_6合一全螢幕分析圖表_${new Date().toISOString().slice(0,10)}.png`;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        showToast("已成功匯出 6 合一全螢幕綜合圖表 PNG！");
                    }
                };
            });
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => { toast.classList.add('translate-y-20', 'opacity-0'); }, 2500);
        }
    </script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

    <!-- 1. 登入介面 -->
    <div id="login-section" class="flex items-center justify-center min-h-screen px-4">
        <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8">
            <div class="text-center mb-8">
                <div class="bg-blue-600 text-white w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-md">
                    <i class="fa-solid fa-industry"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800">工廠新品追蹤系統</h2>
                <p class="text-sm text-gray-500 mt-1">請使用 Firebase 電子郵件帳號登入</p>
            </div>
            <div id="login-error" class="hidden mb-4 p-3 bg-red-100 text-red-700 text-sm rounded-lg"></div>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">電子郵件</label>
                    <input type="email" id="email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">密碼</label>
                    <input type="password" id="password" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition font-medium shadow-md">登入系統</button>
            </form>
        </div>
    </div>

    <!-- 2. 主應用程式介面 -->
    <div id="app-section" class="hidden flex flex-col min-h-screen">
        <header class="bg-white shadow-sm border-b px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 text-white w-10 h-10 rounded-lg flex items-center justify-center shadow">
                    <i class="fa-solid fa-boxes-stacked"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-gray-800">工廠新品追蹤與進度管理</h1>
                    <div class="flex items-center space-x-3 mt-0.5">
                        <div class="flex items-center space-x-1.5 bg-gray-50 px-2 py-0.5 rounded border">
                            <span id="conn-indicator" class="w-3 h-3 rounded-full bg-gray-400"></span>
                            <span id="conn-text" class="text-xs font-medium text-gray-500">連線檢查中...</span>
                        </div>
                        <span class="text-xs text-gray-500">最後自動儲存: <span id="last-update-time" class="font-medium">同步中...</span></span>
                    </div>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <span id="user-email" class="text-sm text-gray-600 font-medium bg-gray-100 px-3 py-1.5 rounded-full"></span>
                <button id="logout-btn" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-3.5 py-1.5 rounded-lg text-sm transition font-medium">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i> 登出
                </button>
            </div>
        </header>

        <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6 flex flex-col">
            <div class="bg-white p-4 rounded-xl shadow-sm mb-6 flex flex-wrap items-center justify-between gap-4">
                <div class="flex flex-wrap items-center gap-2">
                    <button id="add-row-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow transition flex items-center">
                        <i class="fa-solid fa-plus mr-1.5"></i> 新增資料列
                    </button>
                    <button id="copy-row-btn" class="bg-sky-600 hover:bg-sky-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow transition flex items-center" title="複製表格中最後一筆資料列">
                        <i class="fa-solid fa-copy mr-1.5"></i> 複製前資料列
                    </button>
                    <button id="add-col-btn" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow transition flex items-center">
                        <i class="fa-solid fa-columns mr-1.5"></i> 新增欄位
                    </button>
                    <span class="text-xs text-emerald-600 font-medium flex items-center ml-2 bg-emerald-50 px-3 py-2 rounded-lg border border-emerald-200">
                        <i class="fa-solid fa-circle-info mr-1.5 text-base"></i> 支援智慧燈號 (🟢 🟡 🔴) 與拖曳排序
                    </span>
                </div>
                <div class="flex flex-wrap items-center gap-2">
                    <button id="analyze-btn" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow transition flex items-center">
                        <i class="fa-solid fa-chart-pie mr-1.5"></i> 綜合圖表分析
                    </button>
                    <button id="export-excel-btn" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow transition flex items-center">
                        <i class="fa-solid fa-file-excel mr-1.5"></i> 匯出 Excel
                    </button>
                    <label class="bg-cyan-600 hover:bg-cyan-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow transition cursor-pointer flex items-center">
                        <i class="fa-solid fa-file-arrow-up mr-1.5"></i> 匯入 Excel
                        <input type="file" id="import-excel-input" accept=".xlsx, .xls" class="hidden">
                    </label>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm flex-1 overflow-hidden border flex flex-col">
                <div class="overflow-x-auto flex-1 max-h-[65vh]">
                    <table class="w-full border-collapse text-left text-sm text-gray-600">
                        <thead>
                            <tr id="table-header"></tr>
                        </thead>
                        <tbody id="table-body" class="divide-y divide-gray-200"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- 綜合圖表分析彈跳視窗 (Modal) -->
    <div id="chart-modal" class="hidden fixed inset-0 bg-white z-50 flex flex-col">
        <header class="bg-gray-900 text-white px-6 py-4 flex flex-wrap justify-between items-center shadow-md gap-4">
            <div class="flex items-center space-x-2 overflow-x-auto py-1">
                <h2 class="text-base font-bold whitespace-nowrap mr-2"><i class="fa-solid fa-chart-line text-purple-400 mr-2"></i>綜合圖表分析</h2>
                <button id="tab-btn-1" onclick="switchChartTab(1)" class="px-3 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-bold shadow whitespace-nowrap">1. 累積完成件數</button>
                <button id="tab-btn-2" onclick="switchChartTab(2)" class="px-3 py-1.5 bg-gray-700 text-gray-300 hover:bg-gray-600 rounded-lg text-xs font-medium transition whitespace-nowrap">2. 各站完成日分析</button>
                <button id="tab-btn-3" onclick="switchChartTab(3)" class="px-3 py-1.5 bg-gray-700 text-gray-300 hover:bg-gray-600 rounded-lg text-xs font-medium transition whitespace-nowrap">3. 各站時間瓶頸</button>
                <button id="tab-btn-4" onclick="switchChartTab(4)" class="px-3 py-1.5 bg-gray-700 text-gray-300 hover:bg-gray-600 rounded-lg text-xs font-medium transition whitespace-nowrap">4. 一次通過率</button>
                <button id="tab-btn-5" onclick="switchChartTab(5)" class="px-3 py-1.5 bg-gray-700 text-gray-300 hover:bg-gray-600 rounded-lg text-xs font-medium transition whitespace-nowrap">5. 客戶品號 GAP 散布</button>
                <button id="tab-btn-6" onclick="switchChartTab(6)" class="px-3 py-1.5 bg-gray-700 text-gray-300 hover:bg-gray-600 rounded-lg text-xs font-medium transition whitespace-nowrap">6. 全產品 PO 至入庫</button>
                <button id="tab-btn-7" onclick="switchChartTab(7)" class="px-3 py-1.5 bg-gray-700 text-gray-300 hover:bg-gray-600 rounded-lg text-xs font-medium transition whitespace-nowrap">7. 異常分析報表</button>
            </div>
            <div class="flex items-center space-x-3">
                <button id="export-combined-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow transition flex items-center whitespace-nowrap" title="將前 6 個圖表自動合併為 3x2 全螢幕高解析大圖下載">
                    <i class="fa-solid fa-file-image mr-1.5"></i> 📊 匯出 6 合一全螢幕圖表
                </button>
                <button id="export-abnormal-btn" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow transition flex items-center whitespace-nowrap" title="單獨匯出第 7 個異常分析報表 PNG">
                    <i class="fa-solid fa-triangle-exclamation mr-1.5"></i> 📥 獨立匯出異常分析
                </button>
                <button id="export-charts-btn" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow transition flex items-center whitespace-nowrap">
                    <i class="fa-solid fa-download mr-1.5"></i> 匯出所有獨立圖表
                </button>
                <button onclick="closeChartModal()" class="text-gray-300 hover:text-white text-3xl font-bold px-2">&times;</button>
            </div>
        </header>
        <div class="flex-1 p-8 flex items-center justify-center bg-gray-50">
            <div class="w-full h-full max-w-6xl bg-white p-6 rounded-2xl shadow-xl relative flex items-center justify-center">
                <div id="chart-view-1" class="w-full h-full"><canvas id="chartCanvas_1"></canvas></div>
                <div id="chart-view-2" class="w-full h-full hidden"><canvas id="chartCanvas_2"></canvas></div>
                <div id="chart-view-3" class="w-full h-full hidden"><canvas id="chartCanvas_3"></canvas></div>
                <div id="chart-view-4" class="w-full h-full hidden"><canvas id="chartCanvas_4"></canvas></div>
                <div id="chart-view-5" class="w-full h-full hidden"><canvas id="chartCanvas_5"></canvas></div>
                <div id="chart-view-6" class="w-full h-full hidden"><canvas id="chartCanvas_6"></canvas></div>
                <div id="chart-view-7" class="w-full h-full hidden"><canvas id="chartCanvas_7"></canvas></div>
            </div>
        </div>
    </div>

    <!-- 浮動提示訊息 Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-gray-800 text-white px-4 py-2 rounded-lg shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-50 text-sm"></div>

</body>
</html>
