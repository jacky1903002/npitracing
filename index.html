<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工廠新品追蹤管理系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (Excel 匯入匯出) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Chart.js (圖表分析) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome 圖標 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK (v9 模組化版本 CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        // ==========================================
        // Firebase 專案設定
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyDt1V52eifMtZU03MacwjTpo94WfKng3To",
            authDomain: "npitracing.firebaseapp.com",
            databaseURL: "https://npitracing-default-rtdb.firebaseio.com",
            projectId: "npitracing",
            storageBucket: "npitracing.firebasestorage.app",
            messagingSenderId: "659482190192",
            appId: "1:659482190192:web:4a1da1941a2124a6a56fb5",
            measurementId: "G-ZGGL2574BB"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const defaultColumns = [
            "產品品號", "客戶品號", "圖面繪製完成日", "材料到廠日", 
            "開始加工日", "完成加工日", "品保開始檢驗日", "品保完成檢驗日", "產品入庫日"
        ];

        const defaultRows = [
            { id: "row_1", data: { "產品品號": "PN-A001", "客戶品號": "CUST-001", "圖面繪製完成日": "2026-10-01", "材料到廠日": "2026-10-03", "開始加工日": "2026-10-04", "完成加工日": "2026-10-06", "品保開始檢驗日": "2026-10-07", "品保完成檢驗日": "2026-10-07", "產品入庫日": "2026-10-08" } },
            { id: "row_2", data: { "產品品號": "PN-A002", "客戶品號": "CUST-002", "圖面繪製完成日": "2026-10-02", "材料到廠日": "2026-10-05", "開始加工日": "2026-10-06", "完成加工日": "2026-10-10", "品保開始檢驗日": "2026-10-11", "品保完成檢驗日": "2026-10-11", "產品入庫日": "2026-10-12" } }
        ];

        let columns = [...defaultColumns];
        let tableData = [...defaultRows];
        let activeCharts = {};
        let currentChartTab = 1;
        let isInitialLoading = true;
        let draggedColIdx = null;
        let draggedRowId = null;

        window.addEventListener('DOMContentLoaded', () => {
            const loginSection = document.getElementById('login-section');
            const appSection = document.getElementById('app-section');
            const loginForm = document.getElementById('login-form');
            const logoutBtn = document.getElementById('logout-btn');
            const loginError = document.getElementById('login-error');

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    loginSection.classList.add('hidden');
                    appSection.classList.remove('hidden');
                    document.getElementById('user-email').innerText = user.email;
                    loadDataFromCloud();
                } else {
                    loginSection.classList.remove('hidden');
                    appSection.classList.add('hidden');
                }
            });

            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                loginError.classList.add('hidden');

                signInWithEmailAndPassword(auth, email, password)
                    .catch((error) => {
                        loginError.innerText = "登入失敗: " + error.message;
                        loginError.classList.remove('hidden');
                    });
            });

            logoutBtn.addEventListener('click', () => { signOut(auth); });

            document.getElementById('add-row-btn').addEventListener('click', addRow);
            document.getElementById('add-col-btn').addEventListener('click', addColumnPrompt);
            document.getElementById('export-excel-btn').addEventListener('click', exportToExcel);
            document.getElementById('import-excel-input').addEventListener('change', importFromExcel);
            document.getElementById('analyze-btn').addEventListener('click', openChartModal);

            const connectedRef = ref(db, '.info/connected');
            onValue(connectedRef, (snap) => {
                const indicator = document.getElementById('conn-indicator');
                const text = document.getElementById('conn-text');
                if (snap.val() === true) {
                    indicator.className = "w-3 h-3 rounded-full bg-emerald-500 animate-pulse";
                    text.innerText = "雲端已連線";
                    text.className = "text-xs font-medium text-emerald-600";
                } else {
                    indicator.className = "w-3 h-3 rounded-full bg-red-500";
                    text.innerText = "雲端斷線中";
                    text.className = "text-xs font-medium text-red-600";
                }
            });
        });

        function loadDataFromCloud() {
            const dbRef = ref(db, 'factory_tracking');
            onValue(dbRef, (snapshot) => {
                const val = snapshot.val();
                if (val) {
                    if (val.columns) columns = val.columns;
                    if (val.rows) tableData = val.rows;
                    if (val.lastUpdated) {
                        document.getElementById('last-update-time').innerText = val.lastUpdated;
                    }
                }
                isInitialLoading = false;
                renderTable();
            });
        }

        window.autoSaveToCloud = function() {
            if (isInitialLoading) return;
            const nowStr = new Date().toLocaleString('zh-TW', { hour12: false });
            const dbRef = ref(db, 'factory_tracking');
            set(dbRef, {
                columns: columns,
                rows: tableData,
                lastUpdated: nowStr
            }).then(() => {
                document.getElementById('last-update-time').innerText = nowStr;
                showToast("已自動同步至雲端");
            }).catch((error) => {
                console.error("自動儲存失敗: ", error);
            });
        }

        // ================= 渲染表格與拖曳邏輯 =================
        window.renderTable = function() {
            const thead = document.getElementById('table-header');
            const tbody = document.getElementById('table-body');
            
            // 表頭渲染與欄位拖曳事件
            let headerHtml = `<th class="px-4 py-3 bg-gray-100 text-left text-xs font-medium text-gray-600 uppercase tracking-wider sticky left-0 z-10 w-20 text-center">操作/排序</th>`;
            columns.forEach((col, idx) => {
                headerHtml += `
                    <th class="px-4 py-3 bg-gray-100 text-left text-xs font-medium text-gray-600 uppercase tracking-wider min-w-[160px] cursor-grab active:cursor-grabbing select-none"
                        draggable="true"
                        ondragstart="onColumnDragStart(event, ${idx})"
                        ondragover="event.preventDefault()"
                        ondrop="onColumnDrop(event, ${idx})">
                        <div class="flex items-center justify-between">
                            <span onclick="renameColumn(${idx})" class="cursor-pointer hover:text-blue-600 truncate" title="點擊修改欄位名稱"><i class="fa-solid fa-grip-vertical mr-1 text-gray-400"></i>${col}</span>
                            <button onclick="deleteColumn(${idx})" class="text-red-400 hover:text-red-600 ml-2" title="刪除欄位"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </th>
                `;
            });
            thead.innerHTML = headerHtml;

            // 資料列渲染與列位拖曳事件
            let bodyHtml = '';
            tableData.forEach((row, rIdx) => {
                bodyHtml += `
                    <tr class="hover:bg-gray-50 transition-colors"
                        draggable="true"
                        ondragstart="onRowDragStart(event, '${row.id}')"
                        ondragover="event.preventDefault()"
                        ondrop="onRowDrop(event, '${row.id}')">
                `;
                bodyHtml += `
                    <td class="px-2 py-2 whitespace-nowrap text-center sticky left-0 bg-white z-10 border-b">
                        <div class="flex items-center justify-center space-x-1.5">
                            <span class="cursor-grab text-gray-400 hover:text-gray-600 px-1" title="按住拖曳調整列順序"><i class="fa-solid fa-bars"></i></span>
                            <button onclick="deleteRow('${row.id}')" class="text-red-500 hover:text-red-700" title="刪除此列"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </td>
                `;
                columns.forEach(col => {
                    const val = row.data[col] || '';
                    const isDate = col.includes('日');
                    const inputType = isDate ? 'date' : 'text';
                    bodyHtml += `
                        <td class="px-4 py-2 whitespace-nowrap border-b">
                            <input type="${inputType}" value="${val}" 
                                class="w-full bg-transparent border-0 focus:ring-1 focus:ring-blue-500 rounded px-1 py-1 text-sm text-gray-700"
                                onchange="updateCellData('${row.id}', '${col}', this.value)">
                        </td>
                    `;
                });
                bodyHtml += `</tr>`;
            });
            tbody.innerHTML = bodyHtml;
        }

        // 欄位拖曳處理
        window.onColumnDragStart = function(e, idx) {
            draggedColIdx = idx;
        }
        window.onColumnDrop = function(e, targetIdx) {
            e.preventDefault();
            if (draggedColIdx === null || draggedColIdx === targetIdx) return;
            const movedCol = columns.splice(draggedColIdx, 1)[0];
            columns.splice(targetIdx, 0, movedCol);
            draggedColIdx = null;
            renderTable();
            autoSaveToCloud();
        }

        // 列位拖曳處理
        window.onRowDragStart = function(e, rowId) {
            draggedRowId = rowId;
        }
        window.onRowDrop = function(e, targetRowId) {
            e.preventDefault();
            if (!draggedRowId || draggedRowId === targetRowId) return;
            const fromIdx = tableData.findIndex(r => r.id === draggedRowId);
            const toIdx = tableData.findIndex(r => r.id === targetRowId);
            if (fromIdx !== -1 && toIdx !== -1) {
                const movedRow = tableData.splice(fromIdx, 1)[0];
                tableData.splice(toIdx, 0, movedRow);
                draggedRowId = null;
                renderTable();
                autoSaveToCloud();
            }
        }

        window.updateCellData = function(rowId, colName, value) {
            const row = tableData.find(r => r.id === rowId);
            if (row) {
                row.data[colName] = value;
                autoSaveToCloud();
            }
        }

        function addRow() {
            const newId = 'row_' + Date.now();
            const newRowData = {};
            columns.forEach(col => newRowData[col] = '');
            tableData.push({ id: newId, data: newRowData });
            renderTable();
            autoSaveToCloud();
        }

        window.deleteRow = function(rowId) {
            tableData = tableData.filter(r => r.id !== rowId);
            renderTable();
            autoSaveToCloud();
        }

        function addColumnPrompt() {
            const colName = prompt("請輸入新欄位名稱：");
            if (colName && colName.trim() !== "") {
                if (columns.includes(colName.trim())) {
                    alert("欄位名稱已存在！");
                    return;
                }
                columns.push(colName.trim());
                tableData.forEach(row => { row.data[colName.trim()] = ''; });
                renderTable();
                autoSaveToCloud();
            }
        }

        window.renameColumn = function(idx) {
            const oldName = columns[idx];
            const newName = prompt(`請輸入新的欄位名稱 (原名稱: ${oldName})：`, oldName);
            if (newName && newName.trim() !== "" && newName.trim() !== oldName) {
                if (columns.includes(newName.trim())) {
                    alert("欄位名稱已存在！");
                    return;
                }
                columns[idx] = newName.trim();
                tableData.forEach(row => {
                    row.data[newName.trim()] = row.data[oldName] || '';
                    delete row.data[oldName];
                });
                renderTable();
                autoSaveToCloud();
            }
        }

        window.deleteColumn = function(idx) {
            if (columns.length <= 1) {
                alert("至少需保留一個欄位！");
                return;
            }
            const colName = columns[idx];
            if (confirm(`確定要刪除欄位「${colName}」嗎？`)) {
                columns.splice(idx, 1);
                tableData.forEach(row => { delete row.data[colName]; });
                renderTable();
                autoSaveToCloud();
            }
        }

        // ================= Excel 匯入匯出 =================
        function exportToExcel() {
            const exportData = tableData.map(row => {
                let obj = {};
                columns.forEach(col => { obj[col] = row.data[col] || ''; });
                return obj;
            });
            const worksheet = XLSX.utils.json_to_sheet(exportData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "新品追蹤表");
            XLSX.writeFile(workbook, "工廠新品追蹤表_" + new Date().toISOString().slice(0,10) + ".xlsx");
        }

        function importFromExcel(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet);

                    if (json.length > 0) {
                        columns = Object.keys(json[0]);
                        tableData = json.map((item, idx) => ({ id: 'import_' + idx + '_' + Date.now(), data: item }));
                        renderTable();
                        autoSaveToCloud();
                        showToast("Excel 匯入成功並已自動存入雲端！");
                    }
                } catch (err) {
                    alert("匯入失敗: " + err.message);
                }
                e.target.value = '';
            };
            reader.readAsArrayBuffer(file);
        }

        // ================= 全螢幕多頁圖表分析系統 =================
        window.openChartModal = function() {
            const modal = document.getElementById('chart-modal');
            modal.classList.remove('hidden');
            switchChartTab(1);
        }

        window.closeChartModal = function() {
            document.getElementById('chart-modal').classList.add('hidden');
        }

        window.switchChartTab = function(tabNum) {
            currentChartTab = tabNum;
            for (let i = 1; i <= 3; i++) {
                const btn = document.getElementById(`tab-btn-${i}`);
                const view = document.getElementById(`chart-view-${i}`);
                if (i === tabNum) {
                    btn.className = "px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium shadow";
                    view.classList.remove('hidden');
                } else {
                    btn.className = "px-4 py-2 bg-gray-200 text-gray-700 hover:bg-gray-300 rounded-lg text-sm font-medium transition";
                    view.classList.add('hidden');
                }
            }
            renderSpecificChart(tabNum);
        }

        function renderSpecificChart(tabNum) {
            const canvasId = `chartCanvas_${tabNum}`;
            const ctx = document.getElementById(canvasId).getContext('2d');
            if (activeCharts[tabNum]) {
                activeCharts[tabNum].destroy();
            }

            if (tabNum === 1) {
                // 圖表 1：累積完成首件件數 (依產品入庫日或完成加工日排序累積)
                const dateCounts = {};
                tableData.forEach(row => {
                    const d = row.data['產品入庫日'] || row.data['完成加工日'];
                    if (d) {
                        const dateKey = d.slice(0, 10); // YYYY-MM-DD
                        dateCounts[dateKey] = (dateCounts[dateKey] || 0) + 1;
                    }
                });
                const sortedDates = Object.keys(dateCounts).sort();
                let cumulative = 0;
                const cumData = sortedDates.map(date => {
                    cumulative += dateCounts[date];
                    return cumulative;
                });

                activeCharts[1] = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: sortedDates.length > 0 ? sortedDates : ['無完成資料'],
                        datasets: [{
                            label: '累積完成首件件數',
                            data: sortedDates.length > 0 ? cumData : [0],
                            borderColor: 'rgba(37, 99, 235, 1)',
                            backgroundColor: 'rgba(37, 99, 235, 0.1)',
                            fill: true,
                            tension: 0.2,
                            borderWidth: 3
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { title: { display: true, text: '新品開發累積完成首件件數趨勢圖', font: { size: 16 } } },
                        scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
                    }
                });

            } else if (tabNum === 2) {
                // 圖表 2：各站完成日進度分佈 (統計各月份各站點完成件數)
                const stations = ["圖面繪製完成日", "材料到廠日", "開始加工日", "完成加工日", "品保完成檢驗日", "產品入庫日"];
                const monthsSet = new Set();
                tableData.forEach(row => {
                    stations.forEach(st => {
                        if (row.data[st]) monthsSet.add(row.data[st].slice(0, 7));
                    });
                });
                const sortedMonths = Array.from(monthsSet).sort();
                const datasets = stations.map((st, idx) => {
                    const colors = [
                        'rgba(59, 130, 246, 0.7)', 'rgba(16, 185, 129
