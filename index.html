<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工廠新品追蹤管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

        // ==========================================
        // Firebase 專案設定
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyDt1V52eifMtZU03MacwjTpo94WfKng3To",
            authDomain: "npitracing.firebaseapp.com",
            databaseURL: "https://npitracing-default-rtdb.firebaseio.com",
            projectId: "npitracing",
            storageBucket: "npitracing.firebasestorage.app",
            messagingSenderId: "659482190192",
            appId: "1:659482190192:web:4a1da1941a2124a6a56fb5",
            measurementId: "G-ZGGL2574BB"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const defaultColumns = [
            "產品品號", "客戶品號", "製令編號", "PO下單日", "圖面繪製完成日", 
            "BOM完成日", "多部門會簽完成日", "材料到廠日", "製造開始加工日", 
            "製造完成加工日", "其他(半品)等待開始日", "其他(半品)完成日", "委外完成日", 
            "品保開始檢驗日", "品保完成檢驗日", "異常返修完工日", "異常返修檢驗完成日", 
            "產品入庫日", "目標完成日", "備註", "是否有重工"
        ];

        const allStations = [
            { key: "PO下單日", name: "PO下單" },
            { key: "圖面繪製完成日", name: "圖面繪製" },
            { key: "BOM完成日", name: "BOM完成" },
            { key: "多部門會簽完成日", name: "多部門會簽" },
            { key: "材料到廠日", name: "材料到廠" },
            { key: "製造開始加工日", name: "製造開始加工" },
            { key: "製造完成加工日", name: "製造完成加工" },
            { key: "其他(半品)等待開始日", name: "半品等待開始" },
            { key: "其他(半品)完成日", name: "半品完成" },
            { key: "委外完成日", name: "委外完成" },
            { key: "品保開始檢驗日", name: "品保開始檢驗" },
            { key: "品保完成檢驗日", name: "品保完成檢驗" },
            { key: "異常返修完工日", name: "異常返修完工" },
            { key: "異常返修檢驗完成日", name: "異常返修檢驗" },
            { key: "產品入庫日", name: "產品入庫" }
        ];

        const defaultRows = [
            { 
                id: "row_1", 
                isHidden: false,
                data: { 
                    "產品品號": "PN-A001", "客戶品號": "CUST-001", "製令編號": "MO-2026-001", "PO下單日": "2026-09-25", "圖面繪製完成日": "2026-10-01", 
                    "BOM完成日": "2026-10-02", "多部門會簽完成日": "2026-10-02", "材料到廠日": "2026-10-03", "製造開始加工日": "2026-10-04", 
                    "製造完成加工日": "2026-10-06", "其他(半品)等待開始日": "", "其他(半品)完成日": "", "委外完成日": "", "品保開始檢驗日": "2026-10-07", "品保完成檢驗日": "2026-10-07", 
                    "異常返修完工日": "", "異常返修檢驗完成日": "", "產品入庫日": "2026-10-08", "目標完成日": "2026-10-10", "備註": "首件試產順利", "是否有重工": "" 
                } 
            },
            { 
                id: "row_2", 
                isHidden: false,
                data: { 
                    "產品品號": "PN-A002", "客戶品號": "CUST-002", "製令編號": "MO-2026-002", "PO下單日": "2026-09-20", "圖面繪製完成日": "2026-09-25", 
                    "BOM完成日": "2026-09-26", "多部門會簽完成日": "2026-09-27", "材料到廠日": "2026-09-28", "製造開始加工日": "2026-09-30", 
                    "製造完成加工日": "2026-10-05", "其他(半品)等待開始日": "", "其他(半品)完成日": "", "委外完成日": "", "品保開始檢驗日": "2026-10-06", "品保完成檢驗日": "2026-10-07", 
                    "異常返修完工日": "2026-10-08", "異常返修檢驗完成日": "2026-10-09", "產品入庫日": "2026-10-10", "目標完成日": "2026-10-01", "備註": "尺寸異常重工", "是否有重工": "有重工" 
                } 
            }
        ];

        let columns = [...defaultColumns];
        let tableData = [...defaultRows];
        let activeCharts = {};
        let currentChartTab = 1;
        let isInitialLoading = true;
        let draggedRowId = null;

        function getResolvedDates(rowData) {
            let res = {};
            let lastDate = null;
            allStations.forEach(st => {
                let val = rowData[st.key];
                if (val && val.trim() !== "") {
                    lastDate = val;
                }
                res[st.key] = lastDate;
            });
            return res;
        }

        window.addEventListener('DOMContentLoaded', () => {
            const loginSection = document.getElementById('login-section');
            const appSection = document.getElementById('app-section');
            const loginForm = document.getElementById('login-form');
            const logoutBtn = document.getElementById('logout-btn');
            const loginError = document.getElementById('login-error');

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    loginSection.classList.add('hidden');
                    appSection.classList.remove('hidden');
                    document.getElementById('user-email').innerText = user.email;
                    loadDataFromCloud();
                } else {
                    loginSection.classList.remove('hidden');
                    appSection.classList.add('hidden');
                }
            });

            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                loginError.classList.add('hidden');
                signInWithEmailAndPassword(auth, email, password)
                    .catch((error) => {
                        loginError.innerText = "登入失敗: " + error.message;
                        loginError.classList.remove('hidden');
                    });
            });

            logoutBtn.addEventListener('click', () => { signOut(auth); });

            document.getElementById('add-row-btn').addEventListener('click', addRow);
            document.getElementById('copy-row-btn').addEventListener('click', copyPreviousRow);
            document.getElementById('export-excel-btn').addEventListener('click', exportToExcel);
            document.getElementById('import-excel-input').addEventListener('change', importFromExcel);
            document.getElementById('analyze-btn').addEventListener('click', openChartModal);

            const connectedRef = ref(db, '.info/connected');
            onValue(connectedRef, (snap) => {
                const indicator = document.getElementById('conn-indicator');
                const text = document.getElementById('conn-text');
                if (snap.val() === true) {
                    indicator.className = "w-3 h-3 rounded-full bg-emerald-500 animate-pulse";
                    text.innerText = "雲端已連線";
                    text.className = "text-xs font-medium text-emerald-600";
                } else {
                    indicator.className = "w-3 h-3 rounded-full bg-red-500";
                    text.innerText = "雲端斷線中";
                    text.className = "text-xs font-medium text-red-600";
                }
            });
        });

        function loadDataFromCloud() {
            const dbRef = ref(db, 'factory_tracking');
            onValue(dbRef, (snapshot) => {
                const val = snapshot.val();
                if (val) {
                    if (val.columns) {
                        defaultColumns.forEach(defCol => {
                            if (!val.columns.includes(defCol)) val.columns.push(defCol);
                        });
                        columns = val.columns;
                    }
                    if (val.rows) {
                        tableData = val.rows.map(r => ({
                            ...r,
                            isHidden: r.isHidden !== undefined ? r.isHidden : false
                        }));
                    }
                    if (val.lastUpdated) {
                        document.getElementById('last-update-time').innerText = val.lastUpdated;
                    }
                }
                isInitialLoading = false;
                renderTable();
            });
        }

        window.autoSaveToCloud = function() {
            if (isInitialLoading) return;
            const nowStr = new Date().toLocaleString('zh-TW', { hour12: false });
            const dbRef = ref(db, 'factory_tracking');
            set(dbRef, {
                columns: columns,
                rows: tableData,
                lastUpdated: nowStr
            }).then(() => {
                document.getElementById('last-update-time').innerText = nowStr;
                showToast("已自動同步至雲端");
            }).catch((error) => {
                console.error("自動儲存失敗: ", error);
            });
        }

        // ================= 渲染表格與燈號計算 =================
        window.renderTable = function() {
            const thead = document.getElementById('table-header');
            const tbody = document.getElementById('table-body');
            
            let headerHtml = `<th class="px-3 py-2 bg-gray-100 text-center text-xs font-medium text-gray-600 uppercase tracking-wider sticky left-0 z-30 w-20 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]">燈號</th>`;
            headerHtml += `<th class="px-3 py-2 bg-gray-100 text-center text-xs font-medium text-gray-600 uppercase tracking-wider sticky left-20 z-30 w-28 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]">圖表隱藏</th>`;
            headerHtml += `<th class="px-3 py-2 bg-gray-100 text-center text-xs font-medium text-gray-600 uppercase tracking-wider sticky left-[152px] z-30 w-16 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]">操作</th>`;
            
            columns.forEach((col, idx) => {
                const isRemark = (col === "備註");
                const colTitleAttr = isRemark ? "點擊修改備註欄位名稱" : "此欄位名稱已鎖定";
                
                let stickyClass = "";
                if (idx === 0) {
                    stickyClass = "sticky left-[216px] z-30 bg-gray-100 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]";
                } else if (idx === 1) {
                    stickyClass = "sticky left-[326px] z-30 bg-gray-100 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]";
                } else if (idx === 2) {
                    stickyClass = "sticky left-[436px] z-30 bg-gray-100 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]";
                }

                let minWidthStyle = (idx === 0 || idx === 1 || idx === 2) ? "min-w-[110px]" : "min-w-[140px]";

                headerHtml += `
                    <th class="px-3 py-2 bg-gray-100 text-left text-xs font-medium text-gray-600 uppercase tracking-wider ${minWidthStyle} select-none ${stickyClass}">
                        <div class="flex items-center justify-between">
                            <span ${isRemark ? `onclick="renameColumn(${idx})" class="cursor-pointer hover:text-blue-600 truncate"` : `class="truncate text-gray-700"`} title="${colTitleAttr}">
                                ${isRemark ? '<i class="fa-solid fa-pen mr-1 text-blue-500"></i>' : ''}${col}
                            </span>
                        </div>
                    </th>
                `;
            });
            thead.innerHTML = headerHtml;

            let bodyHtml = '';
            tableData.forEach((row) => {
                let lightHtml = `<span class="px-2 py-0.5 text-xs font-bold rounded-full bg-gray-200 text-gray-700">未定</span>`;
                const targetDateStr = row.data["目標完成日"];
                const actualDateStr = row.data["產品入庫日"];

                if (targetDateStr) {
                    const targetTime = new Date(targetDateStr).getTime();
                    const checkTime = actualDateStr ? new Date(actualDateStr).getTime() : new Date().getTime();
                    const diffDays = (checkTime - targetTime) / (1000 * 3600 * 24);

                    if (diffDays <= 0) {
                        lightHtml = `<span class="inline-flex items-center px-2 py-0.5 text-xs font-bold rounded-full bg-emerald-100 text-emerald-800" title="進度超前或準時"><span class="w-1.5 h-1.5 mr-1 bg-emerald-500 rounded-full animate-pulse"></span>🟢 綠燈</span>`;
                    } else if (diffDays <= 15) {
                        lightHtml = `<span class="inline-flex items-center px-2 py-0.5 text-xs font-bold rounded-full bg-amber-100 text-amber-800" title="落後 1~15 天"><span class="w-1.5 h-1.5 mr-1 bg-amber-500 rounded-full"></span>🟡 黃燈</span>`;
                    } else {
                        lightHtml = `<span class="inline-flex items-center px-2 py-0.5 text-xs font-bold rounded-full bg-red-100 text-red-800" title="落後超過 15 天"><span class="w-1.5 h-1.5 mr-1 bg-red-500 rounded-full"></span>🔴 紅燈</span>`;
                    }
                }

                const hideBtnClass = row.isHidden ? "bg-red-100 text-red-700 border-red-300" : "bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100";
                const hideBtnText = row.isHidden ? '<i class="fa-solid fa-eye-slash mr-1"></i>已隱藏' : '<i class="fa-solid fa-eye mr-1"></i>分析中';

                bodyHtml += `
                    <tr class="hover:bg-gray-50 transition-colors ${row.isHidden ? 'opacity-50 bg-gray-50' : ''}"
                        draggable="true"
                        ondragstart="onRowDragStart(event, '${row.id}')"
                        ondragover="event.preventDefault()"
                        ondrop="onRowDrop(event, '${row.id}')">
                `;
                bodyHtml += `<td class="px-2 py-1.5 whitespace-nowrap text-center sticky left-0 bg-white z-30 border-b shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]">${lightHtml}</td>`;
                bodyHtml += `
                    <td class="px-2 py-1.5 whitespace-nowrap text-center sticky left-20 bg-white z-30 border-b shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]">
                        <button onclick="toggleRowHidden('${row.id}')" class="px-2 py-1 text-xs font-semibold rounded border ${hideBtnClass} transition shadow-sm w-24">
                            ${hideBtnText}
                        </button>
                    </td>
                `;
                bodyHtml += `
                    <td class="px-2 py-1.5 whitespace-nowrap text-center sticky left-[152px] bg-white z-30 border-b shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]">
                        <div class="flex items-center justify-center space-x-1">
                            <span class="cursor-grab text-gray-400 hover:text-gray-600 px-0.5" title="按住拖曳調整列順序"><i class="fa-solid fa-bars"></i></span>
                            <button onclick="deleteRow('${row.id}')" class="text-red-500 hover:text-red-700" title="刪除此列"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </td>
                `;
                columns.forEach((col, idx) => {
                    const val = row.data[col] || '';
                    const isDate = col.includes('日');
                    const inputType = isDate ? 'date' : 'text';

                    let stickyCellClass = "";
                    if (idx === 0) {
                        stickyCellClass = "sticky left-[216px] z-30 bg-white border-b shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]";
                    } else if (idx === 1) {
                        stickyCellClass = "sticky left-[326px] z-30 bg-white border-b shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]";
                    } else if (idx === 2) {
                        stickyCellClass = "sticky left-[436px] z-30 bg-white border-b shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]";
                    } else {
                        stickyCellClass = "border-b";
                    }

                    bodyHtml += `
                        <td class="px-3 py-1.5 whitespace-nowrap ${stickyCellClass}">
                            <input type="${inputType}" value="${val}" 
                                class="w-full bg-transparent border-0 focus:ring-1 focus:ring-blue-500 rounded px-1 py-0.5 text-xs text-gray-700"
                                onchange="updateCellData('${row.id}', '${col}', this.value)">
                        </td>
                    `;
                });
                bodyHtml += `</tr>`;
            });
            tbody.innerHTML = bodyHtml;
        }

        window.toggleRowHidden = function(rowId) {
            const row = tableData.find(r => r.id === rowId);
            if (row) {
                row.isHidden = !row.isHidden;
                renderTable();
                autoSaveToCloud();
                showToast(row.isHidden ? "已將此產品自圖表分析中隱藏" : "已將此產品恢復納入圖表分析");
            }
        }

        window.onRowDragStart = function(e, rowId) { draggedRowId = rowId; }
        window.onRowDrop = function(e, targetRowId) {
            e.preventDefault();
            if (!draggedRowId || draggedRowId === targetRowId) return;
            const fromIdx = tableData.findIndex(r => r.id === draggedRowId);
            const toIdx = tableData.findIndex(r => r.id === targetRowId);
            if (fromIdx !== -1 && toIdx !== -1) {
                const movedRow = tableData.splice(fromIdx, 1)[0];
                tableData.splice(toIdx, 0, movedRow);
                draggedRowId = null;
                renderTable();
                autoSaveToCloud();
            }
        }

        window.updateCellData = function(rowId, colName, value) {
            const row = tableData.find(r => r.id === rowId);
            if (row) {
                row.data[colName] = value;
                renderTable();
                autoSaveToCloud();
            }
        }

        function addRow() {
            const newId = 'row_' + Date.now();
            const newRowData = {};
            columns.forEach(col => newRowData[col] = '');
            tableData.push({ id: newId, isHidden: false, data: newRowData });
            renderTable();
            autoSaveToCloud();
        }

        function copyPreviousRow() {
            if (tableData.length === 0) {
                addRow();
                return;
            }
            const lastRow = tableData[tableData.length - 1];
            const newId = 'row_' + Date.now();
            const copiedData = { ...lastRow.data };
            tableData.push({ id: newId, isHidden: false, data: copiedData });
            renderTable();
            autoSaveToCloud();
            showToast("已成功複製上一筆資料列！");
        }

        window.deleteRow = function(rowId) {
            tableData = tableData.filter(r => r.id !== rowId);
            renderTable();
            autoSaveToCloud();
        }

        window.renameColumn = function(idx) {
            const oldName = columns[idx];
            if (oldName !== "備註") {
                alert("此欄位名稱已鎖定，無法修改！");
                return;
            }
            const newName = prompt(`請輸入新的備註欄位名稱：`, oldName);
            if (newName && newName.trim() !== "" && newName.trim() !== oldName) {
                if (columns.includes(newName.trim())) {
                    alert("欄位名稱已存在！");
                    return;
                }
                columns[idx] = newName.trim();
                tableData.forEach(row => {
                    row.data[newName.trim()] = row.data[oldName] || '';
                    delete row.data[oldName];
                });
                renderTable();
                autoSaveToCloud();
            }
        }

        // ================= Excel 匯入匯出 =================
        function exportToExcel() {
            const exportData = tableData.map(row => {
                let obj = {};
                columns.forEach(col => { obj[col] = row.data[col] || ''; });
                return obj;
            });
            const worksheet = XLSX.utils.json_to_sheet(exportData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "新品追蹤表");
            XLSX.writeFile(workbook, "工廠新品追蹤表_" + new Date().toISOString().slice(0,10) + ".xlsx");
        }

        function importFromExcel(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet);
                    if (json.length > 0) {
                        columns = [...defaultColumns];
                        tableData = json.map((item, idx) => ({ id: 'import_' + idx + '_' + Date.now(), isHidden: false, data: item }));
                        renderTable();
                        autoSaveToCloud();
                        showToast("Excel 匯入成功並已自動存入雲端！");
                    }
                } catch (err) {
                    alert("匯入失敗: " + err.message);
                }
                e.target.value = '';
            };
            reader.readAsArrayBuffer(file);
        }

        // ================= 綜合圖表分析系統 =================
        window.openChartModal = function() {
            const modal = document.getElementById('chart-modal');
            modal.classList.remove('hidden');
            switchChartTab(1);
        }

        window.closeChartModal = function() {
            document.getElementById('chart-modal').classList.add('hidden');
        }

        window.switchChartTab = function(tabNum) {
            currentChartTab = tabNum;
            for (let i = 1; i <= 6; i++) {
                const btn = document.getElementById(`tab-btn-${i}`);
                const view = document.getElementById(`chart-view-${i}`);
                if (i === tabNum) {
                    btn.className = "px-3 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-bold shadow whitespace-nowrap";
                    view.classList.remove('hidden');
                } else {
                    btn.className = "px-3 py-1.5 bg-gray-700 text-gray-300 hover:bg-gray-600 rounded-lg text-xs font-medium transition whitespace-nowrap";
                    view.classList.add('hidden');
                }
            }
            renderSpecificChart(tabNum);
        }

        function renderSpecificChart(tabNum) {
            const canvasId = `chartCanvas_${tabNum}`;
            const ctx = document.getElementById(canvasId).getContext('2d');
            if (activeCharts[tabNum]) {
                activeCharts[tabNum].destroy();
            }

            const abnormalContainer = document.getElementById('abnormal-analysis-container');
            if (abnormalContainer) {
                if (tabNum === 2) {
                    abnormalContainer.classList.remove('hidden');
                    renderAbnormalTable();
                } else {
                    abnormalContainer.classList.add('hidden');
                }
            }

            const activeTableData = tableData.filter(r => !r.isHidden);
            const lastRow = activeTableData[activeTableData.length - 1];
            const lastCustPN = lastRow ? (lastRow.data["客戶品號"] || "最新項目") : "";

            if (tabNum === 1) {
                const dateCounts = {};
                activeTableData.forEach(row => {
                    const resolved = getResolvedDates(row.data);
                    const d = resolved['產品入庫日'] || resolved['製造完成加工日'];
                    if (d) {
                        const dateKey = d.slice(0, 10);
                        dateCounts[dateKey] = (dateCounts[dateKey] || 0) + 1;
                    }
                });
                const sortedDates = Object.keys(dateCounts).sort();
                let cumulative = 0;
                const cumData = sortedDates.map(date => {
                    cumulative += dateCounts[date];
                    return cumulative;
                });
                activeCharts[1] = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: sortedDates.length > 0 ? sortedDates : ['無完成資料'],
                        datasets: [{
                            label: '累積完成首件件數',
                            data: sortedDates.length > 0 ? cumData : [0],
                            borderColor: 'rgba(37, 99, 235, 1)',
                            backgroundColor: 'rgba(37, 99, 235, 0.1)',
                            fill: true,
                            tension: 0.2,
                            borderWidth: 3
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: { display: true, text: '新品開發累積完成首件件數趨勢圖 (已排除隱藏項目)', font: { size: 16 } },
                            datalabels: {
                                align: 'top',
                                anchor: 'end',
                                formatter: function(value, context) {
                                    if (context.dataIndex === context.dataset.data.length - 1) {
                                        return `${lastCustPN} (${value})`;
                                    }
                                    return '';
                                },
                                color: '#000000',
                                font: { weight: 'bold', size: 12 },
                                padding: 4
                            }
                        },
                        scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
                    },
                    plugins: [ChartDataLabels]
                });
            } else if (tabNum === 2) {
                const avgDaysPerStation = allStations.map((st, sIdx) => {
                    if (sIdx === 0) return 0.0;
                    let totalDays = 0;
                    let count = 0;
                    activeTableData.forEach(row => {
                        const resolved = getResolvedDates(row.data);
                        const po = resolved["PO下單日"];
                        const stDate = resolved[st.key];
                        if (po && stDate) {
                            const diff = (new Date(stDate).getTime() - new Date(po).getTime()) / (1000 * 3600 * 24);
                            if (diff >= 0) {
                                totalDays += diff;
                                count++;
                            }
                        }
                    });
                    return count > 0 ? parseFloat((totalDays / count).toFixed(1)) : 0.0;
                });

                activeCharts[2] = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: allStations.map(s => s.name),
                        datasets: [{
                            label: '平均累積天數 (自 PO 下單起算)',
                            data: avgDaysPerStation,
                            borderColor: 'rgba(16, 185, 129, 1)',
                            backgroundColor: 'rgba(16, 185, 129, 0.1)',
                            fill: true,
                            tension: 0.2,
                            borderWidth: 3,
                            pointRadius: 6
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        layout: { padding: { top: 60, bottom: 20, right: 30, left: 20 } },
                        plugins: {
                            title: { display: true, text: '各站點平均累積天數與區段間隔天數分析圖 (已排除隱藏項目)', font: { size: 16 } },
                            datalabels: {
                                align: function(context) {
                                    return context.dataIndex % 2 === 0 ? 'top' : 'bottom';
                                },
                                anchor: function(context) {
                                    return context.dataIndex % 2 === 0 ? 'end' : 'start';
                                },
                                formatter: function(value, context) {
                                    const idx = context.dataIndex;
                                    const currentVal = value;
                                    const totalLen = context.dataset.data.length;

                                    if (idx === 0) {
                                        return `${currentVal.toFixed(1)}d`;
                                    } else {
                                        const prevVal = context.dataset.data[idx - 1];
                                        const diffInterval = parseFloat((currentVal - prevVal).toFixed(1));
                                        let labelStr = `累:${currentVal.toFixed(1)}d (+${diffInterval}d)`;
                                        if (idx === totalLen - 1) {
                                            labelStr = `${lastCustPN} | 累:${currentVal.toFixed(1)}d (+${diffInterval}d)`;
                                        }
                                        return labelStr;
                                    }
                                },
                                color: '#000000',
                                font: { weight: 'bold', size: 10 },
                                padding: 4
                            }
                        },
                        scales: { 
                            x: { 
                                grace: '10%',
                                ticks: { font: { size: 11 }, maxRotation: 45, minRotation: 45 }
                            },
                            y: { beginAtZero: true, title: { display: true, text: '累積天數 (Days)' } } 
                        }
                    },
                    plugins: [ChartDataLabels]
                });
            } else if (tabNum === 3) {
                const intervalKeys = [];
                for (let i = 0; i < allStations.length - 1; i++) {
                    intervalKeys.push({
                        from: allStations[i].key,
                        to: allStations[i+1].key,
                        name: `${allStations[i].name} → ${allStations[i+1].name}`
                    });
                }

                const durations = intervalKeys.map(() => []);
                activeTableData.forEach(row => {
                    const resolved = getResolvedDates(row.data);
                    intervalKeys.forEach((ik, ikIdx) => {
                        const s1 = resolved[ik.from];
                        const s2 = resolved[ik.to];
                        if (s1 && s2) {
                            const diff = (new Date(s2).getTime() - new Date(s1).getTime()) / (1000 * 3600 * 24);
                            if (diff >= 0) durations[ikIdx].push(diff);
                        }
                    });
                });

                const avg = arr => arr.length ? parseFloat((arr.reduce((a, b) => a + b, 0) / arr.length).toFixed(1)) : 0.0;
                const avgIntervalData = durations.map(arr => avg(arr));

                activeCharts[3] = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: intervalKeys.map(k => k.name),
                        datasets: [{
                            label: '區段平均耗時 (天)',
                            data: avgIntervalData,
                            borderColor: 'rgba(217, 119, 6, 1)',
                            backgroundColor: 'rgba(217, 119, 6, 0.1)',
                            fill: true,
                            tension: 0.2,
                            borderWidth: 3,
                            pointRadius: 5
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        layout: { padding: { top: 50, right: 30, left: 20 } },
                        plugins: {
                            title: { display: true, text: '各相鄰站點平均流轉與加工天數瓶頸分析 (已排除隱藏項目)', font: { size: 16 } },
                            datalabels: {
                                align: function(context) {
                                    return context.dataIndex % 2 === 0 ? 'top' : 'bottom';
                                },
                                anchor: function(context) {
                                    return context.dataIndex % 2 === 0 ? 'end' : 'start';
                                },
                                formatter: function(value) {
                                    return `${value.toFixed(1)}d`;
                                },
                                color: '#000000',
                                font: { weight: 'bold', size: 10 },
                                padding: 4
                            }
                        },
                        scales: { 
                            x: { 
                                grace: '10%',
                                ticks: { font: { size: 10 }, maxRotation: 45, minRotation: 45 }
                            },
                            y: { beginAtZero: true, title: { display: true, text: '天數 (Days)' } } 
                        }
                    },
                    plugins: [ChartDataLabels]
                });
            } else if (tabNum === 4) {
                // 一次通過率計算：分母為「有填客戶產品的列總數」，重工計次為「是否有重工欄位有填任意文字」
                const validRows = activeTableData.filter(row => row.data["客戶品號"] && row.data["客戶品號"].trim() !== "");
                let totalValidCount = validRows.length;
                let reworkCount = validRows.filter(row => row.data["是否有重工"] && row.data["是否有重工"].trim() !== "").length;
                let passFirstTimeCount = totalValidCount - reworkCount;
                if (passFirstTimeCount < 0) passFirstTimeCount = 0;
                let passRate = totalValidCount > 0 ? ((passFirstTimeCount / totalValidCount) * 100).toFixed(1) : "0.0";

                activeCharts[4] = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['一次通過件數', '重工件數'],
                        datasets: [{
                            data: [passFirstTimeCount, reworkCount],
                            backgroundColor: ['#10b981', '#ef4444'],
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: { display: true, text: `新品開發一次通過率: ${passRate}% (有效總數: ${totalValidCount} 件，重工: ${reworkCount} 件)`, font: { size: 16 } },
                            legend: { position: 'bottom' }
                        }
                    }
                });
            } else if (tabNum === 5) {
                const scatterData = [];
                const productLabels = [];
                activeTableData.forEach((row, idx) => {
                    const custPn = row.data["客戶品號"] || `項次 ${idx+1}`;
                    productLabels.push(custPn);
                    const resolved = getResolvedDates(row.data);
                    const target = row.data["目標完成日"];
                    const actual = resolved["產品入庫日"] || new Date().toISOString().slice(0, 10);
                    if (target) {
                        const diff = parseFloat(((new Date(actual).getTime() - new Date(target).getTime()) / (1000 * 3600 * 24)).toFixed(1));
                        scatterData.push({ x: idx + 1, y: diff, custName: custPn });
                    }
                });
                activeCharts[5] = new Chart(ctx, {
                    type: 'scatter',
                    data: {
                        datasets: [{
                            label: '目標 vs 實際 GAP (天)',
                            data: scatterData,
                            backgroundColor: '#8b5cf6',
                            pointRadius: 8,
                            pointHoverRadius: 10
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        layout: { padding: { top: 35, right: 30 } },
                        plugins: {
                            title: { display: true, text: '各專案目標完成日 vs 實際入庫日 GAP 散布圖 (已排除隱藏項目)', font: { size: 16 } },
                            datalabels: {
                                align: 'top',
                                anchor: 'end',
                                formatter: function(value, context) {
                                    if (context.dataIndex === context.dataset.data.length - 1) {
                                        return `${value.custName} (${value.y > 0 ? '+' + value.y : value.y}天)`;
                                    }
                                    return `${value.custName}`;
                                },
                                color: '#000000',
                                font: { weight: 'bold', size: 12 },
                                padding: 4
                            }
                        },
                        scales: {
                            x: {
                                grace: '10%',
                                title: { display: true, text: '客戶品號' },
                                ticks: {
                                    callback: function(val) {
                                        return productLabels[val - 1] || '';
                                    },
                                    stepSize: 1
                                }
                            },
                            y: { title: { display: true, text: 'GAP 天數 (實際 - 目標)' } }
                        }
                    },
                    plugins: [ChartDataLabels]
                });
            } else if (tabNum === 6) {
                const scatterData = [];
                const productLabels = [];
                activeTableData.forEach((row, idx) => {
                    const custPn = row.data["客戶品號"] || `項次 ${idx+1}`;
                    productLabels.push(custPn);
                    const resolved = getResolvedDates(row.data);
                    const po = resolved["PO下單日"];
                    const inDate = resolved["產品入庫日"];
                    if (po && inDate) {
                        const days = parseFloat(((new Date(inDate).getTime() - new Date(po).getTime()) / (1000 * 3600 * 24)).toFixed(1));
                        if (days >= 0) {
                            scatterData.push({ x: idx + 1, y: days, custName: custPn });
                        }
                    }
                });
                const currentMonthStr = new Date().toISOString().slice(0, 7);
                const monthInCount = activeTableData.filter(row => {
                    const resolved = getResolvedDates(row.data);
                    return resolved["產品入庫日"] && resolved["產品入庫日"].startsWith(currentMonthStr);
                }).length;

                activeCharts[6] = new Chart(ctx, {
                    type: 'scatter',
                    data: {
                        datasets: [{
                            label: 'PO 到入庫總天數',
                            data: scatterData,
                            backgroundColor: '#3b82f6',
                            pointRadius: 8,
                            pointHoverRadius: 10
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        layout: { padding: { top: 35, right: 30 } },
                        plugins: {
                            title: { display: true, text: `全產品一覽：PO 到入庫總天數散布圖 (本月入庫數: ${monthInCount} 件，已排除隱藏)`, font: { size: 16 } },
                            datalabels: {
                                align: 'top',
                                anchor: 'end',
                                formatter: function(value, context) {
                                    if (context.dataIndex === context.dataset.data.length - 1) {
                                        return `${value.custName} (${value.y}天)`;
                                    }
                                    return `${value.custName}`;
                                },
                                color: '#000000',
                                font: { weight: 'bold', size: 12 },
                                padding: 4
                            }
                        },
                        scales: {
                            x: {
                                grace: '10%',
                                title: { display: true, text: '客戶品號' },
                                ticks: {
                                    callback: function(val) {
                                        return productLabels[val - 1] || '';
                                    },
                                    stepSize: 1
                                }
                            },
                            y: { title: { display: true, text: '總天數 (Days)' }, beginAtZero: true }
                        }
                    },
                    plugins: [ChartDataLabels]
                });
            }
        }

        // ================= 異常事件分析表格 =================
        function renderAbnormalTable() {
            const tbody = document.getElementById('abnormal-table-body');
            if (!tbody) return;

            let html = '';
            let hasData = false;
            const activeTableData = tableData.filter(r => !r.isHidden);

            activeTableData.forEach(row => {
                const remark = row.data["備註"];
                if (remark && remark.trim() !== "") {
                    hasData = true;
                    const custPn = row.data["客戶品號"] || "N/A";
                    const resolved = getResolvedDates(row.data);
                    
                    let maxIntervalDays = 0;
                    let longestIntervalName = "PO下單 - 圖面繪製";

                    let prevDate = null;
                    let prevName = "";

                    allStations.forEach(st => {
                        const dateStr = resolved[st.key];
                        if (dateStr) {
                            const curDate = new Date(dateStr).getTime();
                            if (prevDate !== null) {
                                const diff = Math.round((curDate - prevDate) / (1000 * 3600 * 24));
                                if (diff > maxIntervalDays) {
                                    maxIntervalDays = diff;
                                    longestIntervalName = `${prevName} - ${st.name}`;
                                }
                            }
                            prevDate = curDate;
                            prevName = st.name;
                        }
                    });

                    html += `
                        <tr class="hover:bg-gray-50">
                            <td class="px-3 py-2 border-b font-medium text-gray-800">${remark}</td>
                            <td class="px-3 py-2 border-b text-gray-600">${custPn}</td>
                            <td class="px-3 py-2 border-b text-gray-600">${longestIntervalName}</td>
                            <td class="px-3 py-2 border-b text-red-600 font-bold">${maxIntervalDays} 天</td>
                        </tr>
                    `;
                }
            });

            if (!hasData) {
                html = `<tr><td colspan="4" class="px-3 py-4 text-center text-gray-400">目前尚無未隱藏之備註或異常事件紀錄</td></tr>`;
            }
            tbody.innerHTML = html;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }
    </script>
</head>

    <!-- 綜合圖表分析 Modal -->
    <div id="chart-modal" class="hidden fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-6xl h-[90vh] rounded-2xl shadow-2xl flex flex-col overflow-hidden">
            <div class="bg-gray-900 px-6 py-3 flex items-center justify-between border-b border-gray-800 flex-wrap gap-2">
                <div class="flex items-center space-x-2 overflow-x-auto py-1">
                    <button id="tab-btn-1" onclick="switchChartTab(1)" class="px-3 py-1.5 bg-blue-600 text-white rounded-lg text-xs font-bold shadow whitespace-nowrap">1. 累積完成趨勢</button>
                    <button id="tab-btn-2" onclick="switchChartTab(2)" class="px-3 py-1.5 bg-gray-700 text-gray-300 hover:bg-gray-600 rounded-lg text-xs font-medium transition whitespace-nowrap">2. 站點平均天數</button>
                    <button id="tab-btn-3" onclick="switchChartTab(3)" class="px-3 py-1.5 bg-gray-700 text-gray-300 hover:bg-gray-600 rounded-lg text-xs font-medium transition whitespace-nowrap">3. 流轉與加工瓶頸</button>
                    <button id="tab-btn-4" onclick="switchChartTab(4)" class="px-3 py-1.5 bg-gray-700 text-gray-300 hover:bg-gray-600 rounded-lg text-xs font-medium transition whitespace-nowrap">4. 一次通過率</button>
                    <button id="tab-btn-5" onclick="switchChartTab(5)" class="px-3 py-1.5 bg-gray-700 text-gray-300 hover:bg-gray-600 rounded-lg text-xs font-medium transition whitespace-nowrap">5. 客戶品號 GAP 散布</button>
                    <button id="tab-btn-6" onclick="switchChartTab(6)" class="px-3 py-1.5 bg-gray-700 text-gray-300 hover:bg-gray-600 rounded-lg text-xs font-medium transition whitespace-nowrap">6. 全產品 PO 至入庫</button>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="closeChartModal()" class="text-gray-400 hover:text-white p-1.5 rounded-lg hover:bg-gray-800 transition">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>
            </div>

            <div class="flex-1 p-6 flex flex-col items-center justify-center bg-gray-50 overflow-y-auto">
                <div class="w-full h-full max-w-6xl bg-white p-6 rounded-2xl shadow-xl relative flex flex-col items-center justify-center">
                    <div id="chart-view-1" class="w-full h-full"><canvas id="chartCanvas_1"></canvas></div>
                    
                    <!-- 第二頁圖表與異常事件分析表格 -->
                    <div id="chart-view-2" class="w-full h-full hidden flex flex-col">
                        <div class="w-full h-[60%]"><canvas id="chartCanvas_2"></canvas></div>
                        <div id="abnormal-analysis-container" class="w-full h-[40%] mt-3 border-t pt-3 overflow-y-auto">
                            <h3 class="text-xs font-bold text-gray-700 mb-2 flex items-center">
                                <i class="fa-solid fa-triangle-exclamation text-amber-500 mr-1.5"></i> 備註異常事件分析列表
                            </h3>
                            <table class="w-full border-collapse text-left text-xs">
                                <thead class="bg-gray-100 text-gray-600">
                                    <tr>
                                        <th class="px-3 py-1.5 border-b">備註原因</th>
                                        <th class="px-3 py-1.5 border-b">客戶品號</th>
                                        <th class="px-3 py-1.5 border-b">異常站點</th>
                                        <th class="px-3 py-1.5 border-b">異常天數</th>
                                    </tr>
                                </thead>
                                <tbody id="abnormal-table-body" class="divide-y divide-gray-200">
                                    <!-- 動態填入 -->
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div id="chart-view-3" class="w-full h-full hidden"><canvas id="chartCanvas_3"></canvas></div>
                    <div id="chart-view-4" class="w-full h-full hidden"><canvas id="chartCanvas_4"></canvas></div>
                    <div id="chart-view-5" class="w-full h-full hidden"><canvas id="chartCanvas_5"></canvas></div>
                    <div id="chart-view-6" class="w-full h-full hidden"><canvas id="chartCanvas_6"></canvas></div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-5 right-5 z-50 bg-gray-900 text-white px-4 py-2.5 rounded-xl shadow-2xl text-xs font-medium transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none"></div>

</body>
</html>
